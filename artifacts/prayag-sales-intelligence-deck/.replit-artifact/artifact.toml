kind = "slides"
previewPath = "/prayag-sales-intelligence-deck/"
title = "Prayag Sales Intelligence"
description = "An 18-slide product overview deck for Prayag Sales Intelligence, showing how the platform connects sales data, performance analytics, customer and SKU intelligence, alerts, AI reporting, commercial levers, and accountable field action."
version = "1.0.0"
id = "artifacts/prayag-sales-intelligence-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/prayag-sales-intelligence-deck/" ]
localPort = 20337

[services.development]
run = "pnpm --filter @workspace/prayag-sales-intelligence-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prayag-sales-intelligence-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/prayag-sales-intelligence-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20337"
BASE_PATH = "/prayag-sales-intelligence-deck/"
