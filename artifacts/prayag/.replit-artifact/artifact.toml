kind = "data-app"
previewPath = "/"
title = "Prayag Sales Intelligence"
version = "1.0.0"
id = "artifacts/prayag"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20948

[services.development]
run = "pnpm --filter @workspace/prayag run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prayag", "run", "build" ]
publicDir = "artifacts/prayag/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20948"
BASE_PATH = "/"
