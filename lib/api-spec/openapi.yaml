      required:
        - status
    DashboardXlsxStatus:
      type: object
      properties:
        fy:
          type: string
        parsedAt:
          type: string
        fileName:
          type: string
        totalRecords:
          type: integer
        activeRecords:
          type: integer
        leftRecords:
          type: integer
        isQuarterly:
          type: boolean
        targetPeriod:
          type: string
        headerRow:
          type: integer
        unmatchedSample:
          type: array
