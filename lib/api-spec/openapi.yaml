        state: { type: string, nullable: true }
        district: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateHead: { type: string, nullable: true }
        headConfidence: { type: string, enum: [Confirmed, Guessed] }
        supplyingDistributor: { type: string, nullable: true }
