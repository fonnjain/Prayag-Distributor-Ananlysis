            bottom:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            newTop:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            churned:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            newCount: { type: number }
            oldCount: { type: number }
            churnedCount: { type: number }
        movers:
          type: object
          required: [partiesUp, partiesDown, segmentsUp, segmentsDown]
          properties:
            partiesUp:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            partiesDown:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            segmentsUp:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            segmentsDown:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
    SalesRepMonthRow:
      type: object
      required: [month, orderAmount, orders, saleAmount]
      properties:
        month: { type: string, description: "Fiscal month label e.g. Apr-25" }
        orderAmount: { type: number }
        orders: { type: number }
        saleAmount: { type: number }
    PrimaryParty:
      type: object
      required: [party, amount]
      properties:
        party: { type: string }
        amount: { type: number }
    PrimaryReport:
      type: object
      required: [available, headTotal, bridgedToAnyTmAmount, totalBridged, bridgeCoverage, bridgedParties, unbridgedParties]
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        headTotal: { type: number }
        bridgedToAnyTmAmount: { type: number }
        totalBridged: { type: number }
        bridgeCoverage: { type: number, description: "% of head register bridged to any TM" }
        bridgedParties:
          type: array
          items: { $ref: "#/components/schemas/PrimaryParty" }
        unbridgedParties:
          type: array
          items: { $ref: "#/components/schemas/PrimaryParty" }
    RepPartyRow:
      type: object
      required: [id, name, amount, priorAmount]
      properties:
        id: { type: string }
        name: { type: string }
        amount: { type: number }
        priorAmount: { type: number }
    ItemCodeRow:
      type: object
      required: [code, description, amount]
      properties:
        code: { type: string }
        description: { type: string }
        amount: { type: number }
    PartyGroupRow:
      type: object
      required: [party, state, total, byGroup]
      properties:
        party: { type: string }
        state: { type: string }
        total: { type: number }
        byGroup:
          type: object
          additionalProperties: { type: number }
    SalesRepReport:
      type: object
      required: [fy, priorFy, repKey, repName, scope, hasTeam, available, basis, monthly, stateOptions, secondary, primary, reconciliation]
      properties:
        fy: { type: string }
        priorFy: { type: string }
        repKey: { type: string }
        repName: { type: string }
        scope: { type: string, enum: [own, team] }
        hasTeam: { type: boolean }
        available: { type: boolean }
        reason: { type: string, nullable: true }
        basis: { type: string, enum: [secondary, primary] }
        monthly:
          type: array
          items: { $ref: "#/components/schemas/SalesRepMonthRow" }
        stateOptions:
          type: array
          items: { type: string }
          description: Sorted list of states for the 3A/3B/3C state selector.
        secondary:
          type: object
          required: [tiles, byState, partyByState, segmentByState, byGroup, bySegment, parties, movers, saleCollection, byStateByMonth, byGroupByState, partyGroupMatrix]
          properties:
            tiles:
              type: object
              required: [netOrderBooked, netOrderBookedLast, growthPct, orders, activeRetailers, newRetailers, avgOrderValue, businessPerRetailer, target, achievementPct]
              properties:
                netOrderBooked: { type: number }
                netOrderBookedLast: { type: number }
                growthPct: { type: number, nullable: true }
                orders: { type: number }
                activeRetailers: { type: number }
                newRetailers: { type: number }
                avgOrderValue: { type: number, nullable: true }
                businessPerRetailer: { type: number, nullable: true }
                target: { type: number, nullable: true }
                achievementPct: { type: number, nullable: true }
            byState:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            partyByState:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/RepPartyRow" }
              description: State name -> list of parties with this-FY and prior-FY amounts.
            segmentByState:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/DeepRow" }
              description: State name -> segment comparison rows.
            byGroup:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            bySegment:
              type: array
              items: { $ref: "#/components/schemas/DeepRow" }
            parties:
              type: object
              required: [top, newTop, churned, newCount, churnedCount]
              properties:
                top:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                newTop:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                churned:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                newCount: { type: number }
                churnedCount: { type: number }
            movers:
              type: object
              required: [partiesUp, partiesDown, segmentsUp, segmentsDown]
              properties:
                partiesUp:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                partiesDown:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                segmentsUp:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
                segmentsDown:
                  type: array
                  items: { $ref: "#/components/schemas/DeepRow" }
            saleCollection:
              type: object
              required: [sale, saleLast]
              properties:
                sale: { type: number }
                saleLast: { type: number }
                collection: { type: number, nullable: true }
            byStateByMonth:
              type: array
              description: Report 2 — State totals with month-by-month columns and growth vs prior FY.
              items:
                type: object
                required: [state, thisFy, lastFy, diff, growthPct, months, monthsPrior]
                properties:
                  state: { type: string }
                  thisFy: { type: number }
                  lastFy: { type: number }
                  diff: { type: number }
                  growthPct: { type: number, nullable: true }
                  months:
                    type: array
                    items: { type: number }
                  monthsPrior:
                    type: array
                    items: { type: number }
            byGroupByState:
              type: object
              additionalProperties:
                type: array
                items: { $ref: "#/components/schemas/DeepRow" }
              description: Report 3A — State to group comparison rows.
            partyGroupMatrix:
              type: array
              items: { $ref: "#/components/schemas/PartyGroupRow" }
              description: Report 7 — Party by Group matrix.
        primary:
          type: object
          required: [available, headTotal, bridgedToAnyTmAmount, totalBridged, bridgeCoverage, bridgedParties, unbridgedParties, byItemCode]
          properties:
            available: { type: boolean }
            reason: { type: string, nullable: true }
            headTotal: { type: number }
            bridgedToAnyTmAmount: { type: number }
            totalBridged: { type: number }
            bridgeCoverage: { type: number }
            bridgedParties:
              type: array
              items: { $ref: "#/components/schemas/PrimaryParty" }
            unbridgedParties:
              type: array
              items: { $ref: "#/components/schemas/PrimaryParty" }
            byItemCode:
              type: array
              items: { $ref: "#/components/schemas/ItemCodeRow" }
              description: Item-code breakdown from invoice registers. Empty on Secondary basis or when no sale_line data matched.
            itemCodeNote: { type: string, nullable: true }
        reconciliation:
          type: object
          required: [secondary, primary]
          properties:
            secondary:
              type: object
              required: [repTotal, delta, ok, note]
              properties:
                repTotal: { type: number }
                fileTotal: { type: number, nullable: true }
                delta: { type: number }
                ok: { type: boolean }
                note: { type: string }
            primary:
              type: object
              required: [bridgedAmount, unbridgedAmount, headTotal, delta, ok, note]
              properties:
                bridgedAmount: { type: number }
                unbridgedAmount: { type: number }
                headTotal: { type: number }
                delta: { type: number }
                ok: { type: boolean }
                note: { type: string }
    SalesVerifyHead:
