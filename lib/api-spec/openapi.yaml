openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyst
    description: AI sales analyst operations
  - name: drive
    description: Google Drive file operations
  - name: dashboard
    description: Live dashboard data operations
  - name: verify
    description: Data health and reconciliation operations
  - name: mgmt
    description: Management report generation
  - name: sap
    description: SAP primary-sales upload, reconciliation, and cutover
  - name: customer-master
    description: Customer master — editable attribution table with change history and mismatch review queue
paths:
  /drive/files:
    get:
      operationId: listDriveFiles
      tags: [drive]
      summary: List Google Drive files
      description: >
        Lists files from the connected Google Drive account, optionally
        filtered by a search query. Results are ordered by most recently
        modified.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional search text matched against file names.
          schema:
            type: string
            maxLength: 200
        - name: pageToken
          in: query
          required: false
          description: Token for fetching the next page of results.
          schema:
            type: string
      responses:
        "200":
          description: List of Drive files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveFileList"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeSales
      tags: [analyst]
      summary: Ask the AI sales analyst
      description: >
        Sends a natural-language question about Prayag India sales, orders,
        coverage, and product data to the AI analyst and returns a markdown
        answer grounded in the embedded dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analyst answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the latest dashboard snapshot
      description: >
        Returns the most recent aggregated dashboard dataset, built from the
        connected Google Sheets. Falls back to a seeded baseline before the
        first live sync completes.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /dashboard/refresh:
    post:
      operationId: refreshDashboard
      tags: [dashboard]
      summary: Rebuild the dashboard from Google Sheets
      description: >
        Re-reads the source Google Sheets, rebuilds the aggregate dataset, and
        stores a new snapshot. If the refresh fails, the last good snapshot is
        returned with a refreshError message.
      responses:
        "200":
          description: Refreshed dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /verify:
    get:
      operationId: getVerifyReport
      tags: [verify]
      summary: Data health reconciliation report
      description: >
        Compares three sources for the same fiscal year — xlsx as ingested,
        live Google Sheets read now, and the database — reporting row counts,
        amount sums, distinct invoices/customers, by-group and by-head
        breakdowns, deltas over 0.5 percent, and live rows missing from the
        database.
      parameters:
        - name: fy
          in: query
          required: false
          description: Fiscal year, e.g. 2026-27 (default).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyReport"
        "400":
          description: Unknown fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Report could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /verify/backfill:
    post:
      operationId: runVerifyBackfill
      tags: [verify]
      summary: Backfill rows missing from the database
      description: >
        Re-reads the live register for the fiscal year and inserts any lines
        whose uid is not yet in the database. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyBackfillResponse"
        "400":
          description: Unknown fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Backfill failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analytics:
    get:
      operationId: getAnalytics
      tags: [verify]
      summary: Corrected analytics on the invoice-line register
      description: >
        Year-over-year growth over complete months only (partial months are
        flagged and excluded), split into territory vs institutional business,
        plus per-head totals, customer retention over the comparable period,
        and margins (empty until a cost master is loaded).
      parameters:
        - name: fy
          in: query
          required: false
          description: Fiscal year, e.g. 2026-27 (default).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: compare
          in: query
          required: false
          description: Comparison fiscal year (defaults to the prior year).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Analytics report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"
        "400":
          description: Bad fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Analytics could not be computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/payload:
    get:
      operationId: getAiPayload
      tags: [ai]
      summary: Phase A1 — verified metrics payload (no AI call)
      description: >
        Returns the pre-computed, fully reconciled metrics payload for a member or
        state head. Every figure is computed by the app from already-loaded Deep
        Dive data. This endpoint makes NO Anthropic API call. Later phases receive
        this payload and generate narrative; they never do arithmetic on raw sheet
        rows. The payload covers: identity, targets, performance, achievement,
        coverage, customer states, top customers, concentration, visit analytics,
        visit capacity projection, cost and ROI, product-segment spread (closed
        FYs), prior-year comparisons, and data quality flags.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to 2026-27.
        - name: stateHead
          in: query
          schema: { type: string }
          description: >
            Raw state head name as it appears in the sheet. If omitted, the
            payload aggregates across all state heads.
        - name: member
          in: query
          schema: { type: string }
          description: >
            Member name or normSecKey. If omitted, a state-head aggregate
            payload is returned (no retailer-level detail).
        - name: period
          in: query
          schema:
            type: string
            enum: [ytd, year, quarter, q1, q2, q3, q4, month]
          description: >
            Reporting period. Defaults to 'ytd'. All actuals from the State Head
            Dashboard are YTD by construction; this field is recorded in identity
            for downstream labelling only.
      responses:
        "200":
          description: Verified metrics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPayload"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member or state head not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Sheet unreachable or tab not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ai/report:
    post:
      operationId: generateAiReport
      tags: [ai]
      summary: Phase A2 — generate salesperson narrative report via Claude
      description: >
        Builds the Phase A1 payload internally, sends it to Claude with a strict
        system prompt, runs the numeric guard, and returns a structured JSON
        report. No PDF is generated server-side; the client renders and prints
        the returned JSON. Claude never does arithmetic — it receives only the
        pre-computed payload and writes narrative. The numeric guard checks every
        number in the generated text against the payload; any unmatched number
        sets guard.status to "requires_review".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReportRequest"
      responses:
        "200":
          description: Report generated (check guard.status for review flag)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReportResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Claude API unavailable or returned malformed JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /mgmt/deep-dive:
    get:
      operationId: getMgmtDeepDive
      tags: [mgmt]
      summary: Sales Deep Dive — mandatory KPI set for one team member
      description: >
        Returns the ~38 mandatory KPIs from the STATE HEAD DASHBOARD 'Data' tab
        (source A) for a chosen state head + member + fiscal year. Also returns
        the list of all state heads and the members under the selected head for
        populating the dependent dropdowns. Phase 1 reads the live year from
        Sheets; closed FYs will be served from DB snapshots in a later phase.
        Direct Dealers Order is kept separate from retailer/party OB throughout.
        Achievement is always recomputed (sale / plan) — never read from a sheet
        percent cell.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to 2026-27.
        - name: stateHead
          in: query
          schema: { type: string }
          description: >
            Raw state head name as it appears in the sheet (used to filter the
            member dropdown). If omitted, all members are returned.
        - name: member
          in: query
          schema: { type: string }
          description: >
            Member name or normSecKey. Matched with normSecKey (preserves
            parentheticals like (Off Roll)). If omitted, kpis is null.
      responses:
        "200":
          description: Deep-dive data and selector lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtDeepDive"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Sheet unreachable or tab not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /mgmt/distributor-deep-dive:
    get:
      operationId: getMgmtDistributorDeepDive
      tags: [mgmt]
      summary: Distributor Deep Dive — live-year distributor and retailer performance
      description: >
        Reads all member working sheets under a state head and groups retailer
        rows by their Assigned Distributor field. Surfaces direct dealers
        (blank field) as a parallel branch, flags no-distributor retailers ('--')
        as a mapping problem, models comma-separated shared distributors as a
        relation not a string, and excludes numeric/malformed rows. Never
        publishes a distributor total without Confirmed/Guessed confidence split.
        Live year (FY2026-27) only; closed years are served from DB snapshots via
        the Sales Deep Dive.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to 2026-27.
        - name: stateHead
          in: query
          schema: { type: string }
          description: Raw state head name as it appears in the sheet.
      responses:
        "200":
          description: Distributor deep-dive data and selector lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtDistributorDeepDive"
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /mgmt/distributor-tier-override:
    get:
      operationId: getMgmtDistributorTierOverride
      tags: [mgmt]
      summary: D7 — list manual tier overrides for a state head + FY
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to 2026-27.
        - name: stateHead
          in: query
          required: true
          schema: { type: string }
          description: State head display name.
      responses:
        "200":
          description: Array of override rows (empty when none exist)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MgmtDistributorTierOverride" }
        "400":
          description: stateHead missing
    put:
      operationId: putMgmtDistributorTierOverride
      tags: [mgmt]
      summary: D7 — upsert a manual tier override for one distributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MgmtDistributorTierOverrideInput"
      responses:
        "200":
          description: Saved override row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MgmtDistributorTierOverride" }
        "400":
          description: Validation error
    delete:
      operationId: deleteMgmtDistributorTierOverride
      tags: [mgmt]
      summary: D7 — remove a manual tier override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fy, stateHead, normKey]
              properties:
                fy: { type: string }
                stateHead: { type: string }
                normKey: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /mgmt/options:
    get:
      operationId: getMgmtOptions
      tags: [mgmt]
      summary: Filter options for management reports
      description: >
        Returns the available fiscal years, region-to-state map, roster
        states, and the connection status of each data source used by the
        STATE HEAD DASHBOARD report.
      responses:
        "200":
          description: Report filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtOptions"
        "500":
          description: Options could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/report:
    post:
      operationId: generateMgmtReport
      tags: [mgmt]
      summary: Generate the STATE HEAD DASHBOARD Excel report
      description: >
        Builds the STATE HEAD DASHBOARD workbook from live Google Sheets for
        the selected fiscal year and scope, and streams it as an xlsx
        download. Columns whose source is not connected yet are left blank
        with a grey fill and listed in the Missing Data tab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MgmtReportRequest"
      responses:
        "200":
          description: The generated Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No team members match the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Report generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/verify:
    get:
      operationId: verifyMgmtReport
      tags: [mgmt]
      summary: Reconcile the computed report against signed-off dashboard anchors
      description: >
        Compares the app's computed secondary-order-booking report for the
        requested fiscal year against the approved dashboard anchors in
        config/verify_anchors.json. Returns per-check pass/warn/fail with app
        value vs expected vs delta%, an internal cross-foot, and any roster
        head missing from output.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtVerifyResult"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No anchors configured for the fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /targets:
    get:
      operationId: getTargets
      tags: [mgmt]
      summary: Team members with saved targets for a fiscal year
      description: >
        Returns the active roster (optionally scoped to one State Head) with
        each member's prior-year order actuals and any targets already saved
        in the Prayag Target Master sheet.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to the current FY.
        - name: stateHead
          in: query
          schema: { type: string }
          description: Limit rows to one State Head's team.
      responses:
        "200":
          description: Roster with saved targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetsResponse"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Targets could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveTargets
      tags: [mgmt]
      summary: Save targets to the Target Master sheet
      description: >
        Validates and upserts one row per team member into the Prayag Target
        Master Google Sheet, keyed by fiscal year and team member. Monthly
        cells left blank fall back to an equal twelfth of the annual figure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTargetsRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveTargetsResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Save failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /targets/split-preview:
    get:
      operationId: getTargetSplitPreview
      tags: [mgmt]
      summary: Pro-rata split of State Head totals across team members
      description: >
        Splits annual totals across the selected State Head's active team
        members pro-rata by each member's prior-year order actuals. Members
        with no prior-year data receive an average-sized share. Allocations
        are rounded to whole rupees and always sum exactly to the entered
        totals.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to the current FY.
        - name: stateHead
          in: query
          required: true
          schema: { type: string }
        - name: primary
          in: query
          schema: { type: number }
        - name: secondary
          in: query
          schema: { type: number }
        - name: directDealer
          in: query
          schema: { type: number }
        - name: businessPlan
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Split preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitPreviewResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No active team members for the State Head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Split could not be computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /primary-targets:
    get:
      operationId: getPrimaryTargets
      tags: [mgmt]
      summary: Load DB-persisted primary target entries for a fiscal year
      description: >
        Returns the roster (state heads + primary team members) for the FY and
        any primary target entries saved in the database. Each entry includes a
        precomputed monthlyExpanded array (12 values, Apr-Mar) derived from the
        cadence and seasonal weights.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2026-27. Defaults to 2026-27.
      responses:
        "200":
          description: Roster with saved primary target entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryTargetsResponse"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Load failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: savePrimaryTargets
      tags: [mgmt]
      summary: Save primary target entries to the database
      description: >
        Upserts primary target rows, keyed by fiscal year and name. Seasonal
        splitting is applied server-side when targets are read back via
        GET /primary-targets or in the management report route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePrimaryTargetsRequest"
      responses:
        "200":
          description: Save result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePrimaryTargetsResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Save failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /salespeople/tree:
    get:
      operationId: getSalesPeopleTree
      tags: [mgmt]
      summary: Reporting tree of State Heads and their sales people
      description: >
        Returns the roster-derived reporting tree (State Heads as roots, sales
        people nested underneath by Reporting Manager) with each node's own and
        rolled-up team NET secondary order booking for the fiscal year.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
      responses:
        "200":
          description: Reporting tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesTree"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Tree could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /salespeople/deep-dive:
    get:
      operationId: getSalesPersonDeepDive
      tags: [mgmt]
      summary: Per-rep deep dive with FY-vs-FY breakdowns
      description: >
        Headline tiles plus By State, By Party, By Group and By Segment tables
        (this FY vs last FY, with diff, growth% and share%), plus top movers,
        for one sales person's own book or their own + rolled-up team.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
        - name: repKey
          in: query
          required: true
          schema: { type: string }
          description: Normalised rep key from the tree node.
        - name: scope
          in: query
          schema: { type: string, enum: [own, team] }
          description: own = this rep only; team = rep plus rolled-up juniors.
      responses:
        "200":
          description: Deep dive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepDive"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Deep dive could not be computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /salespeople/{key}/reports:
    get:
      operationId: getSalesPersonReports
      tags: [mgmt]
      summary: Full per-salesperson report payload (secondary + primary)
      description: >
        Returns monthly booking (team-rolled up), secondary order-booking
        breakdowns (by state/group/segment/parties/movers), and primary
        dispatched-sale data (bridged parties via Party TM Map, unbridged
        parties, bridge coverage). Used to render the Reports tab and to
        generate the Excel workbook.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Normalised rep key from the tree node.
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
        - name: scope
          in: query
          schema: { type: string, enum: [own, team] }
          description: own = this rep only; team = rep plus rolled-up juniors.
        - name: basis
          in: query
          schema: { type: string, enum: [secondary, primary] }
          description: secondary = order booking file; primary = dispatched-sale registers.
        - name: state
          in: query
          schema: { type: string }
          description: Optional state filter applied server-side before returning partyByState/segmentByState slices.
        - name: party
          in: query
          schema: { type: string }
          description: Optional party (retailer ID) filter applied server-side.
      responses:
        "200":
          description: Sales rep report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRepReport"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Report could not be built
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /salespeople/{key}/reports/download:
    get:
      operationId: getSalesPersonReportsDownload
      tags: [mgmt]
      summary: Download per-salesperson report workbook (xlsx)
      description: >
        Builds a 9-tab Excel workbook (Cover, Monthly Booking, By State, By Group,
        By Segment, Top Parties, New Parties, Churned Parties, Movers) for the
        selected salesperson and fiscal year. Returns the file as an xlsx stream.
        Call via direct fetch — the browser can trigger a native download.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Normalised rep key from the tree node.
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
        - name: basis
          in: query
          schema: { type: string, enum: [secondary, primary] }
          description: >
            secondary = secondary order booking (default);
            primary = SAP dispatched sale via Party TM Map bridge (~37% coverage).
        - name: scope
          in: query
          schema: { type: string, enum: [own, team] }
          description: own = this rep only; team = rep plus rolled-up juniors.
      responses:
        "200":
          description: Excel workbook stream
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Workbook could not be built
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /salespeople/verify:
    get:
      operationId: verifySalesPeople
      tags: [mgmt]
      summary: Reconcile sales-people rollups against locked head anchors
      description: >
        Cross-foots each head's rolled-up rep total against the signed-off net
        anchors, reports name-match coverage between the file and the roster,
        and lists unmatched names in both directions.
      parameters:
        - name: fy
          in: query
          schema: { type: string }
          description: Fiscal year like 2025-26. Defaults to 2025-26.
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesVerify"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /salesperson/analyze:
    post:
      operationId: analyzeSalesPerson
      tags: [mgmt]
      summary: AI narrative or head-level comparison for sales people
      description: >
        In narrative mode, produces an executive summary for one sales person
        (or their team). In compare mode, ranks and contrasts the sales people
        under one State Head. Grounded strictly in the passed net numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalespersonAnalyzeRequest"
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalespersonAnalyzeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The analyst is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/dashboard-xlsx/upload-url:
    get:
      operationId: getMgmtDashboardXlsxUploadUrl
      tags: [mgmt]
      summary: Get a presigned PUT URL for uploading a STATE HEAD DASHBOARD xlsx
      description: >
        Returns a short-lived presigned PUT URL. The browser uploads the xlsx
        file directly to object storage; the API never buffers it.
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardXlsxUploadUrlResponse"
        "500":
          description: Could not create an upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/dashboard-xlsx/register:
    post:
      operationId: registerMgmtDashboardXlsx
      tags: [mgmt]
      summary: Parse and persist an uploaded STATE HEAD DASHBOARD xlsx
      description: >
        Downloads the just-uploaded xlsx from object storage, parses the Data
        tab, and stores the result. Subsequent report requests for the same FY
        will draw targets and stateHead from this data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardXlsxRegisterRequest"
      responses:
        "200":
          description: Parse summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardXlsxStatusResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Uploaded file not found in object storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Parse failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/dashboard-xlsx/{fy}:
    get:
      operationId: getMgmtDashboardXlsxStatus
      tags: [mgmt]
      summary: Get parse status for an uploaded STATE HEAD DASHBOARD xlsx
      parameters:
        - name: fy
          in: path
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Parse status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardXlsxStatusResponse"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No dashboard xlsx uploaded for this FY yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sap/upload-url:
    post:
      operationId: getSapUploadUrl
      tags: [sap]
      summary: Get a signed URL for uploading a SAP file
      description: >
        Returns a short-lived signed PUT URL. The browser uploads the SAP
        primary-sales xlsx directly to object storage; the API never buffers it.
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapUploadUrl"
        "500":
          description: Could not create an upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sap/register:
    post:
      operationId: registerSapUpload
      tags: [sap]
      summary: Process an uploaded SAP primary-sales file
      description: >
        Streams the just-uploaded SAP xlsx for the given fiscal year and month,
        enriches each line via the rate list (item -> group, customer -> state
        head / state / channel), derives the per-month summary, and stores it.
        Re-uploading the same month overwrites the previous import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SapRegisterRequest"
      responses:
        "200":
          description: Per-month summary and FY verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapRegisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Uploaded file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No data rows found in the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Processing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sap/verify:
    get:
      operationId: getSapVerify
      tags: [sap]
      summary: SAP reconciliation and verified-gate report
      description: >
        Reconciles all uploaded SAP months for a fiscal year: customer match
        rate, the Apr-Jul benchmark against the signed-off total, the cross-foot
        (group = head = state = grand), unmatched customers, and unmapped
        groups. The verified flag gates the analytics cutover.
      parameters:
        - name: fy
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapVerifyReport"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Report could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sap/status:
    get:
      operationId: getSapStatus
      tags: [sap]
      summary: Uploaded SAP months for a fiscal year
      description: >
        Lists which months have a SAP file uploaded (with row count, amount, and
        upload time), the full month roster for the year, and whether the SAP
        source is verified.
      parameters:
        - name: fy
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapStatus"
        "400":
          description: Invalid fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Status could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sap/upload:
    delete:
      operationId: deleteSapUpload
      tags: [sap]
      summary: Delete an uploaded SAP month
      description: >
        Removes the stored SAP file and its cached summary for one month, then
        returns the refreshed FY verification report.
      parameters:
        - name: fy
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete result and refreshed report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SapDeleteResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Delete failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customer-master:
    get:
      tags: [customer-master]
      operationId: listCustomerMaster
      summary: List customer master records with optional filters
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [Distributor, "Direct Dealer", Retailer] } }
        - { name: stateHead, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [Active, Inactive, Closed, Converted] } }
        - { name: confidence, in: query, schema: { type: string, enum: [Confirmed, Guessed] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Paginated list of customer master records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMasterListResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/export:
    get:
      tags: [customer-master]
      operationId: exportCustomerMaster
      summary: Export customer master as xlsx
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: stateHead, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: confidence, in: query, schema: { type: string } }
      responses:
        "200":
          description: xlsx file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/import/preview:
    post:
      tags: [customer-master]
      operationId: previewCustomerMasterImport
      summary: Parse an xlsx file and return a diff preview (does not write to DB)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Import diff preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMasterImportPreview" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Unprocessable file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/import/commit:
    post:
      tags: [customer-master]
      operationId: commitCustomerMasterImport
      summary: Commit a previewed import to the database
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerMasterImportCommit" }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMasterImportResult" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/mismatch/count:
    get:
      tags: [customer-master]
      operationId: getCustomerMismatchCount
      summary: Number of unresolved head-attribution mismatches
      responses:
        "200":
          description: Count of pending mismatches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMismatchCountResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/mismatch:
    get:
      tags: [customer-master]
      operationId: listCustomerMismatches
      summary: List head-attribution mismatch queue
      parameters:
        - { name: pending, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Mismatch queue rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMismatchListResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/mismatch/{mid}/resolve:
    post:
      tags: [customer-master]
      operationId: resolveCustomerMismatch
      summary: Approve or dismiss a head-attribution mismatch
      parameters:
        - { name: mid, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerMismatchResolveRequest" }
      responses:
        "200":
          description: Resolution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /customer-master/{id}:
    get:
      tags: [customer-master]
      operationId: getCustomerMasterRecord
      summary: Get a single customer master record with change history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Record and change log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMasterRecordResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [customer-master]
      operationId: updateCustomerMasterRecord
      summary: Update a customer master record (inline edit)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerMasterUpdateRequest" }
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMasterSingleResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    SapUploadUrl:
      type: object
      required: [uploadUrl]
      properties:
        uploadUrl: { type: string }
    SapRegisterRequest:
      type: object
      required: [fy, month, uploadUrl]
      properties:
        fy: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        month: { type: string, description: "Month label like Apr-26" }
        uploadUrl: { type: string }
        originalName: { type: string, nullable: true }
    SapByAmount:
      type: object
      required: [key, amount]
      properties:
        key: { type: string }
        amount: { type: number }
    SapHeadAmount:
      type: object
      required: [head, amount, isTerritory]
      properties:
        head: { type: string }
        amount: { type: number }
        isTerritory: { type: boolean }
    SapCodeAgg:
      type: object
      required: [code, qty, revenue, group]
      properties:
        code: { type: string }
        qty: { type: number }
        revenue: { type: number }
        group: { type: string }
    SapUnmatchedCustomer:
      type: object
      required: [name, amount]
      properties:
        name: { type: string }
        amount: { type: number }
    SapMonthSummary:
      type: object
      required:
        [
          fy,
          monthLabel,
          rowsRead,
          amount,
          territoryAmount,
          institutionalAmount,
          maxInvoiceDate,
          invoiceCount,
          customerCount,
          byHead,
          byState,
          byGroup,
          byCustomer,
          byCode,
          matchedRows,
          matchedRevenue,
          unmatchedCustomers,
          unmappedGroups,
        ]
      properties:
        fy: { type: string }
        monthLabel: { type: string }
        rowsRead: { type: integer }
        amount: { type: number }
        territoryAmount: { type: number }
        institutionalAmount: { type: number }
        maxInvoiceDate: { type: string, nullable: true }
        invoiceCount: { type: integer }
        customerCount: { type: integer }
        byHead:
          type: array
          items: { $ref: "#/components/schemas/SapHeadAmount" }
        byState:
          type: array
          items: { $ref: "#/components/schemas/SapByAmount" }
        byGroup:
          type: array
          items: { $ref: "#/components/schemas/SapByAmount" }
        byCustomer:
          type: array
          items:
            type: array
            items: {}
        byCode:
          type: array
          items: { $ref: "#/components/schemas/SapCodeAgg" }
        matchedRows: { type: integer }
        matchedRevenue: { type: number }
        unmatchedCustomers:
          type: array
          items: { $ref: "#/components/schemas/SapUnmatchedCustomer" }
        unmappedGroups:
          type: array
          items: { $ref: "#/components/schemas/SapByAmount" }
    SapVerifyReport:
      type: object
      required:
        [
          fy,
          uploadedMonths,
          rowsRead,
          grandTotal,
          match,
          benchmark,
          crossFoot,
          unmatchedCustomers,
          unmappedGroups,
          verified,
        ]
      properties:
        fy: { type: string }
        uploadedMonths:
          type: array
          items: { type: string }
        rowsRead: { type: integer }
        grandTotal: { type: number }
        match:
          type: object
          required:
            [
              rowsPct,
              revenuePct,
              matchedRows,
              totalRows,
              matchedRevenue,
              totalRevenue,
              targetPct,
            ]
          properties:
            rowsPct: { type: number }
            revenuePct: { type: number }
            matchedRows: { type: integer }
            totalRows: { type: integer }
            matchedRevenue: { type: number }
            totalRevenue: { type: number }
            targetPct: { type: number }
        benchmark:
          type: object
          required:
            [months, presentMonths, actual, expected, tolerancePct, deltaPct, ok]
          properties:
            months:
              type: array
              items: { type: string }
            presentMonths:
              type: array
              items: { type: string }
            actual: { type: number }
            expected: { type: number }
            tolerancePct: { type: number }
            deltaPct: { type: number, nullable: true }
            ok: { type: boolean }
        crossFoot:
          type: object
          required: [grand, byGroup, byHead, byState, maxDeltaRupees, ok]
          properties:
            grand: { type: number }
            byGroup: { type: number }
            byHead: { type: number }
            byState: { type: number }
            maxDeltaRupees: { type: number }
            ok: { type: boolean }
        unmatchedCustomers:
          type: array
          items: { $ref: "#/components/schemas/SapUnmatchedCustomer" }
        unmappedGroups:
          type: array
          items: { $ref: "#/components/schemas/SapByAmount" }
        verified: { type: boolean }
    SapRegisterResponse:
      type: object
      required: [summary, report]
      properties:
        summary: { $ref: "#/components/schemas/SapMonthSummary" }
        report: { $ref: "#/components/schemas/SapVerifyReport" }
    SapStatusMonth:
      type: object
