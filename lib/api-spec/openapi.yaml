    AnalyticsReport:
      type: object
      properties:
        fy:
          type: string
        compareFy:
          type: string
        months:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMonthStat"
        compareMonths:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMonthStat"
        comparableMonths:
          type: array
          items:
            type: string
          description: Month names complete in both fiscal years.
        yoy:
          type: object
          properties:
            overall:
              $ref: "#/components/schemas/AnalyticsYoy"
            territory:
              $ref: "#/components/schemas/AnalyticsYoy"
            institutional:
              $ref: "#/components/schemas/AnalyticsYoy"
          required:
            - overall
            - territory
            - institutional
        invoicesInPeriod:
          type: integer
        customersInPeriod:
          type: integer
        byHead:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsHeadStat"
        compareByHead:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsHeadStat"
        retention:
          $ref: "#/components/schemas/AnalyticsRetention"
        margins:
          $ref: "#/components/schemas/AnalyticsMargins"
        source:
          type: string
          enum: [sap, register]
          description: Which data source produced this report.
      required:
        - fy
