        - unit
        - expected
        - actual
        - deltaPct
        - status
    MgmtVerifyContext:
      type: object
      description: Registered vs Active counts and Active% for retailers and members, plus roster-match remainder.
      properties:
        registeredRetailers:
          type: number
          nullable: true
          description: Registered retailers (retailer master; null when not loaded in-app).
        activeRetailers:
          type: number
          description: Retailers with at least one order in the FY.
        activeRetailerPct:
          type: number
          nullable: true
          description: Active retailers as a percent of registered retailers.
        registeredMembers:
