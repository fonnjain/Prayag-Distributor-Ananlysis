          description: Human-readable label for the check.
        unit:
          type: string
          enum: [money, count]
          description: Whether the values are rupees or a count.
        expected:
          type: number
          description: Signed-off anchor value.
        actual:
          type: number
          description: The app's computed value.
        deltaPct:
          type: number
          nullable: true
          description: Percentage difference of actual vs expected.
        status:
          type: string
