        - retention
        - margins
        - source
    MgmtRegion:
      type: object
      properties:
        name:
          type: string
          description: Region name (North, West, South, East).
        states:
          type: array
          items:
            type: string
          description: States that the region expands to.
      required:
        - name
        - states
    MgmtSourceStatus:
      type: object
      properties:
        key:
          type: string
          description: Stable source key.
        name:
          type: string
          description: Human-readable source name.
        status:
          type: string
          enum: [connected, partial, missing]
          description: Whether the source currently feeds the report.
        detail:
          type: string
          description: What is connected or what is needed.
      required:
        - key
        - name
        - status
        - detail
    MgmtDeepDive:
      type: object
      required: [fy, stateHeads, members, rowsRead]
      properties:
        fy:
          type: string
          description: Fiscal year, e.g. 2026-27.
        stateHeads:
          type: array
          items: { type: string }
          description: All distinct state heads found in the Data tab.
        members:
          type: array
          items:
            $ref: "#/components/schemas/MgmtDeepDiveMemberRef"
          description: Members under the selected state head (or all members if no head selected).
        kpis:
          nullable: true
          $ref: "#/components/schemas/MgmtDeepDiveKpis"
        retailerDetail:
          nullable: true
          $ref: "#/components/schemas/MgmtRetailerDetail"
          description: >
            Phase 2: retailer-level detail from the member's own working sheet.
            Null when no member is selected. status='not-mapped' when the member
            has no sheet ID in the config; status='error' on read failure.
            Phase 1 KPIs are always returned regardless of this field.
        roiCost:
          nullable: true
          $ref: "#/components/schemas/MgmtRoiCost"
          description: >
            Phase 4: revenue-to-cost analysis. Null until retailer detail is loaded
            (requires spread for OB/sale/visits) or if CTC is missing from the Data tab.
        skuSpread:
          nullable: true
          $ref: "#/components/schemas/MgmtSkuSpread"
          description: >
            Phase 5: segment and SKU spread from secondary_register_line (closed FYs)
            or a live-year placeholder when no register is ingested. Null when no
            member is selected.
        winBack:
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/MgmtWinBackItem"
          description: >
            Phase 6: dormant retailers — customers present in FY2024-25 or FY2025-26
            secondary register for this member but absent from the current working
            sheet. Null when no member is selected.
        rowsRead:
          type: integer
          description: Total rows read from the Data tab.
        fromDbSnapshot:
          type: boolean
          nullable: true
          description: >
            Phase 6: true when the Data-tab member list was served from a DB
            snapshot (no Sheets read on this request). Absent when false.
        error:
          type: string
          nullable: true
    MgmtDeepDiveMemberRef:
      type: object
      required: [stateHead, name, normKey]
      properties:
        stateHead: { type: string }
        name: { type: string }
        normKey: { type: string }
    MgmtDistributorDeepDive:
      type: object
      required: [fy, stateHeads, distributors, sharedRetailers, partyObTotal, membersLoaded, membersNotMapped]
      properties:
        fy: { type: string }
        stateHeads:
          type: array
          items: { type: string }
        distributors:
          type: array
          items: { $ref: "#/components/schemas/MgmtDistributorGroup" }
        sharedRetailers:
          type: array
          items: { $ref: "#/components/schemas/MgmtSharedRetailerEntry" }
        directDealer:
          nullable: true
          $ref: "#/components/schemas/MgmtDirectDealerSummary"
        noneAssigned:
          nullable: true
          $ref: "#/components/schemas/MgmtNoneAssignedSummary"
        mappingQuality:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorMappingQuality"
        partyObTotal: { type: number }
        membersLoaded: { type: integer }
        membersNotMapped: { type: integer }
        whitespace:
          nullable: true
          $ref: "#/components/schemas/MgmtTerritoryWhitespace"
        concentration:
          nullable: true
          $ref: "#/components/schemas/MgmtCustomerConcentration"
        capacityCheck:
          nullable: true
          $ref: "#/components/schemas/MgmtCapacityCheck"
          description: >
            D7: territory visit-capacity reconciliation. Shows demanded retailer
            visits per month (sum of tier cadences) vs available (YTD visits /
            elapsed months). hasShortfall = true when demand exceeds capacity.
        error: { type: string, nullable: true }
    MgmtDistributorGroup:
      type: object
      required: [name, normKey, retailerCount, activeCount, dormantCount, orderBooking, sale, confirmedCount, guessedCount, isConcentrationRisk, retailers]
      properties:
        name: { type: string }
        normKey: { type: string }
        retailerCount: { type: integer }
        activeCount: { type: integer }
        dormantCount: { type: integer }
        orderBooking: { type: number }
        sale: { type: number }
        visits: { type: number, nullable: true }
        obSharePct: { type: number, nullable: true }
        isConcentrationRisk: { type: boolean }
        confirmedCount: { type: integer }
        guessedCount: { type: integer }
        retailers:
          type: array
          items: { $ref: "#/components/schemas/MgmtDistributorRetailerRow" }
        flows:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorFlows"
        skuSpread:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorSkuSpread"
        investment:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorInvestment"
          description: >
            Phase D4: investment (effective discount, cost to serve, credit, scheme),
            revenue-to-cost ROI, and A/B/C tier with recommended action. Always present
            when distributor data loads. Null only if computation fails entirely.
        retailerConcentration:
          nullable: true
          $ref: "#/components/schemas/MgmtRetailerConcentration"
          description: >
            D7: within this distributor's own retailer list (direct dealers excluded),
            the top-5 and top-10 OB share and the single top account.
    MgmtDistributorRetailerRow:
      type: object
      required: [name, orderBooking, sale, isActive, confirmedHead, memberName]
      properties:
        name: { type: string }
        district: { type: string, nullable: true }
        city: { type: string, nullable: true }
        orderBooking: { type: number }
        sale: { type: number }
        visits: { type: number, nullable: true }
        isActive: { type: boolean }
        confirmedHead: { type: boolean }
        memberName: { type: string }
    MgmtSharedRetailerEntry:
      type: object
      required: [name, rawDistributor, distributorParts, orderBooking, sale, isActive, confirmedHead, memberName]
      properties:
        name: { type: string }
        rawDistributor: { type: string }
        distributorParts:
          type: array
          items: { type: string }
        orderBooking: { type: number }
        sale: { type: number }
        visits: { type: number, nullable: true }
        isActive: { type: boolean }
        confirmedHead: { type: boolean }
        memberName: { type: string }
    MgmtDirectDealerSummary:
      type: object
      required: [retailerCount, activeCount, dormantCount, orderBooking, sale]
      properties:
        retailerCount: { type: integer }
        activeCount: { type: integer }
        dormantCount: { type: integer }
        orderBooking: { type: number }
        sale: { type: number }
        visits: { type: number, nullable: true }
    MgmtNoneAssignedSummary:
      type: object
      required: [retailerCount, activeCount, dormantCount, orderBooking, sale, allDormant]
      properties:
        retailerCount: { type: integer }
        activeCount: { type: integer }
        dormantCount: { type: integer }
        orderBooking: { type: number }
        sale: { type: number }
        visits: { type: number, nullable: true }
        visitSharePct: { type: number, nullable: true }
        allDormant: { type: boolean }
    MgmtDistributorMappingQuality:
      type: object
      required: [totalRetailers, blankCount, noneCount, sharedCount, malformedCount, distributorCount, noneAllDormant]
      properties:
        totalRetailers: { type: integer }
        blankCount: { type: integer }
        noneCount: { type: integer }
        sharedCount: { type: integer }
        malformedCount: { type: integer }
        distributorCount: { type: integer }
        noneVisits: { type: number, nullable: true }
        totalVisits: { type: number, nullable: true }
        noneVisitSharePct: { type: number, nullable: true }
        noneAllDormant: { type: boolean }
    MgmtDistributorFlows:
      type: object
      description: >
        Phase D2: the two flows a distributor sits between (primary in-flow from Prayag
        and secondary out-flow to retailers) and the gap between them.
        NET = Sub Total (sale_line.amount) throughout.
        hasPrimaryData=false means no sale_line rows matched — never show a zero.
      required: [hasPrimaryData, primaryDispatch, secondaryOut, secondarySource, period,
                 invoiceCount, monthsActive, matchedCustomers, yoyPeriod]
      properties:
        hasPrimaryData: { type: boolean }
        primaryDispatch: { type: number }
        primaryOb: { type: number, nullable: true }
        pendingValue: { type: number, nullable: true }
        fillRate: { type: number, nullable: true }
        matchedCustomers:
          type: array
          items: { type: string }
        secondaryOut: { type: number }
        secondarySource: { type: string }
        flowGap: { type: number, nullable: true }
        period: { type: string }
        lastInvoiceDate: { type: string, nullable: true }
        daysSinceLastOrder: { type: integer, nullable: true }
        invoiceCount: { type: integer }
        monthsActive: { type: integer }
        ordersPerMonth: { type: number, nullable: true }
        yoyPeriod: { type: string }
        currentPeriodDispatch: { type: number, nullable: true }
        priorPeriodDispatch: { type: number, nullable: true }
        growthPct: { type: number, nullable: true }
    MgmtDistributorSkuSpread:
      type: object
      required: [isLiveYear, totalBroadSegments]
      description: >
        Phase D3: product-line (brand_canon) spread per distributor, sourced from
        secondary_register_line (closed FYs only). Attribution is via the D1
        retailer list — secondary_register_line has no distributor column.
        "Segment" here = brand_canon (product-line name such as "CPVC DURALIFE"),
        which is the finest granularity available in the secondary register.
        isLiveYear=true when no FY2026-27 secondary register has been ingested.
        matchedRetailers=0 means the D1 retailer names did not match any
        secondary_register_line.customer rows — data quality, not an error.
      properties:
        isLiveYear:
          type: boolean
          description: True for the live FY (no secondary register ingested yet).
        liveYearNote:
          type: string
          nullable: true
        totalBroadSegments:
          type: integer
          description: Denominator for broad segment coverage (always 17, from group_map.json).
        recentFy:
          type: string
          nullable: true
          description: Most recent closed FY with any matched data.
        totalNet:
          type: number
          nullable: true
          description: Sum of net_amount (Sub Total) in recentFy.
        distinctBrands:
          type: integer
          nullable: true
          description: Distinct brand_canon values sold in recentFy.
        broadSegmentsCovered:
          type: integer
          nullable: true
          description: Distinct broad segments (of 17) participated in during recentFy.
        netByBrand:
          type: array
          nullable: true
          description: Top brand_canons by net_amount in recentFy (descending).
          items:
            $ref: "#/components/schemas/MgmtDistributorBrandNet"
        netByBroadSegment:
          type: array
          nullable: true
          description: Same data aggregated to broad segment level.
          items:
            $ref: "#/components/schemas/MgmtDistributorBrandNet"
        crossSellDepth:
          type: number
          nullable: true
          description: Average distinct brand_canons per retailer (all closed FYs).
        concentrationHhi:
          type: integer
          nullable: true
          description: HHI over brand_canon NET shares in recentFy (0–10000).
        matchedRetailers:
          type: integer
          nullable: true
          description: D1 retailers that appeared in secondary_register_line (by LOWER TRIM match).
        whitespace:
          type: array
          nullable: true
          description: Ranked whitespace suggestions — range_depth first, lost_brand second, peer_whitespace third.
          items:
            $ref: "#/components/schemas/MgmtWhitespaceHint"
    MgmtDistributorBrandNet:
      type: object
      required: [segment, net, pct]
      description: NET (Sub Total) for a brand_canon or broad segment in a distributor's secondary sales.
      properties:
        segment:
          type: string
          description: brand_canon product-line name or broad segment label.
        net:
          type: number
        pct:
          type: number
          description: Share of this segment in the distributor's total NET (0–100).
    MgmtWhitespaceHint:
      type: object
      required: [type, brand, broadSegment, evidence]
      description: >
        One whitespace suggestion for a distributor. Ranked easiest→hardest:
        range_depth (already in the broad segment), lost_brand (bought before),
        peer_whitespace (comparable distributor sells it).
      properties:
        type:
          type: string
          enum: [range_depth, lost_brand, peer_whitespace]
        brand:
          type: string
          description: brand_canon value being suggested.
        broadSegment:
          type: string
          description: Broad segment this brand_canon maps to.
        evidence:
          type: string
          description: Human-readable explanation of why this is a suggestion.
        peerNames:
          type: array
          nullable: true
          items:
            type: string
          description: Names of peer distributors (peer_whitespace type only).
        peerNet:
          type: number
          nullable: true
          description: Combined NET at peer distributors in recentFy.
    MgmtDistributorInvestment:
      type: object
      required: [creditOutstanding, schemePayouts, tier]
      description: >
        Phase D4: investment analysis and A/B/C tiering per distributor.
        effectiveDiscount is null for the live FY (no secondary register ingested).
        costToServe is null when visit data or member CTC is unavailable.
        credit and scheme always show status='no_source' — never estimated or zero.
      properties:
        effectiveDiscount:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorEffectiveDiscount"
        costToServe:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorCostToServe"
        creditOutstanding:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [no_source] }
        schemePayouts:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [no_source] }
        roi:
          nullable: true
          $ref: "#/components/schemas/MgmtDistributorRoi"
        tier:
          $ref: "#/components/schemas/MgmtDistributorTier"
    MgmtTerritoryWhitespace:
      type: object
      description: >
        Phase D5: territory whitespace and channel overlap.
        Two gap types are always reported separately: COVERAGE GAP (no distributor
        in the district) and ASSIGNMENT GAP (has distributor but unassigned retailers).
        priorYearOb is the sum of the sale field (secondary-received / prior-year
        reference) for direct-dealer and unassigned retailers — the best single-field
        proxy for proven demand in the gap districts.
      required:
        - districtStats
        - totalAssignmentGapRetailers
        - totalAssignmentGapDistricts
        - totalCoverageGapRetailers
        - totalCoverageGapDistricts
        - coverageGapPriorYearOb
        - coverageGapCurrentOb
        - coverageGapVisits
        - channelConflictCount
        - channelNonConflictCount
        - channelConflictEntries
      properties:
        districtStats:
          type: array
          items: { $ref: "#/components/schemas/MgmtDistrictStat" }
        totalAssignmentGapRetailers: { type: integer }
        totalAssignmentGapDistricts: { type: integer }
        totalCoverageGapRetailers: { type: integer }
        totalCoverageGapDistricts: { type: integer }
        coverageGapPriorYearOb: { type: number }
        coverageGapCurrentOb: { type: number }
        coverageGapVisits: { type: integer }
        channelConflictCount: { type: integer }
        channelNonConflictCount: { type: integer }
        channelConflictEntries:
          type: array
          items: { $ref: "#/components/schemas/MgmtChannelConflictEntry" }
    MgmtDistrictStat:
      type: object
      required:
        - district
        - hasDistributor
        - distributorNames
        - coveredCount
        - directCount
        - noneCount
        - totalCount
        - coveredOb
        - directOb
        - noneOb
        - priorYearOb
        - gapType
        - isChannelConflict
        - noneRetailers
      properties:
        district: { type: string }
        hasDistributor: { type: boolean }
        distributorNames:
          type: array
          items: { type: string }
        coveredCount: { type: integer }
        directCount: { type: integer }
        noneCount: { type: integer }
        totalCount: { type: integer }
        coveredOb: { type: number }
        directOb: { type: number }
        noneOb: { type: number }
        priorYearOb: { type: number }
        coveredVisits: { type: integer, nullable: true }
        directVisits: { type: integer, nullable: true }
        noneVisits: { type: integer, nullable: true }
        totalVisits: { type: integer, nullable: true }
        gapType:
          type: string
          enum: [coverage, assignment, both, none]
          description: >
            coverage = no distributor in this district at all (strategic fix).
            assignment = has distributor but some retailers unassigned (admin fix).
            both = no distributor AND some unassigned (edge case).
            none = fully covered.
        isChannelConflict:
          type: boolean
          description: >
            true when direct dealers AND a named distributor both operate here —
            structural channel conflict. Direct dealers in a district WITHOUT a
            distributor are NOT conflict (they are the only channel).
        noneRetailers:
          type: array
          description: Detail of unassigned retailers for dormancy context.
          items:
            type: object
            required: [name, ob, sale, isActive]
            properties:
              name: { type: string }
              ob: { type: number }
              sale: { type: number }
              visits: { type: integer, nullable: true }
              isActive: { type: boolean }
    MgmtChannelConflictEntry:
      type: object
      description: A direct dealer operating inside a district that has a named distributor.
      required: [name, district, ob, sale, isActive]
      properties:
        name: { type: string }
        district: { type: string }
        ob: { type: number }
        sale: { type: number }
        visits: { type: integer, nullable: true }
        isActive: { type: boolean }
    MgmtCustomerConcentration:
      type: object
      description: >
        Phase D6: customer concentration (top-N) and new-vs-repeat business
        (retained / reactivated / at-risk / never). Derived purely from D1 retailer rows.
      required:
        - totalOb
        - top5Ob
        - top10Ob
        - topCustomers
        - customerStates
        - dataCutoffLabel
        - dataCutoffMonthsElapsed
      properties:
        totalOb:              { type: number }
        totalVisits:          { type: integer,  nullable: true }
        overallBizPerVisit:   { type: number,   nullable: true }
        top5Ob:               { type: number }
        top5SharePct:         { type: number,   nullable: true }
        top10Ob:              { type: number }
        top10SharePct:        { type: number,   nullable: true }
        topCustomers:
          type: array
          items: { $ref: "#/components/schemas/MgmtTopCustomerEntry" }
        customerStates:
          type: array
          items: { $ref: "#/components/schemas/MgmtCustomerStateGroup" }
        dataCutoffLabel:         { type: string }
        dataCutoffMonthsElapsed: { type: integer }
        newRetailersOnboarded:   { type: integer, nullable: true }
        newPartyOrderBooking:    { type: number,  nullable: true }
    MgmtTopCustomerEntry:
      type: object
      required: [rank, name, orderBooking, sharePct, cumulativePct, channel, isDirectDealer]
      properties:
        rank:           { type: integer }
        name:           { type: string }
        orderBooking:   { type: number }
        sharePct:       { type: number }
        cumulativePct:  { type: number }
        visits:         { type: integer, nullable: true }
        channel:        { type: string }
        isDirectDealer: { type: boolean }
    MgmtCustomerStateGroup:
      type: object
      description: One of four customer lifecycle states (retained/reactivated/at_risk/never).
      required: [state, label, count, obThisYear, obLastYear]
      properties:
        state:
          type: string
          enum: [retained, reactivated, at_risk, never]
        label:          { type: string }
        count:          { type: integer }
        obThisYear:     { type: number }
        obLastYear:     { type: number }
        visits:         { type: integer,  nullable: true }
        bizPerVisit:    { type: number,   nullable: true }
        visitSharePct:  { type: number,   nullable: true }
        obSharePct:     { type: number,   nullable: true }
    MgmtDistributorEffectiveDiscount:
      type: object
      required: [recentFy, grossTotal, netTotal, discountAmount, weightedDiscountPct, hasAnomalousLines, abovePeerMedian]
      description: >
        Weighted average effective discount per distributor from secondary_register_line.
        weightedDiscountPct = (1 − netTotal / grossTotal) × 100.
        Lines with discount_pct > 100 are excluded from the weighted average and flagged.
        Reconciliation sample: gross × (1 − pct/100) should equal net (rounding).
      properties:
        recentFy: { type: string }
        grossTotal: { type: number }
        netTotal: { type: number }
        discountAmount: { type: number }
        weightedDiscountPct: { type: number }
        hasAnomalousLines: { type: boolean }
        peerMedianDiscountPct: { type: number, nullable: true }
        abovePeerMedian: { type: boolean }
        sampleLineGross: { type: number, nullable: true }
        sampleLineDiscountPct: { type: number, nullable: true }
        sampleLineNet: { type: number, nullable: true }
        sampleLineComputed: { type: number, nullable: true }
    MgmtDistributorCostToServe:
      type: object
      required: [distributorVisits, memberCostPerVisit, visitCostToServe]
      description: >
        Visit-based cost to serve this distributor's retailers.
        memberCostPerVisit uses the SAME formula as Sales Deep Dive Phase 4:
          (ctcMonthly × elapsed complete months + taBillYtd) / totalVisits.
        Both figures are shown so Phase 4 and the distributor breakdown can be compared.
      properties:
        distributorVisits:
          type: number
          description: Sum of retailer visits attributed to this distributor (from D1 member sheets).
        memberCostPerVisit:
          type: number
          description: Member cost per visit — matches Sales Deep Dive Phase 4 output.
        visitCostToServe:
          type: number
          description: distributorVisits × memberCostPerVisit.
    MgmtDistributorRoi:
      type: object
      required: [netRevenue, revenueRecentFy, visitCostToServe, netToCostMultiple, marginRoiAvailable]
      description: >
        Revenue-to-cost return on investment using NET (Sub Total) from D3 secondary data.
        Margin ROI is never computed from MRP or Purchase Price — always false until
        the Cost Master (fg_cost) table is populated.
      properties:
        netRevenue: { type: number }
        revenueRecentFy: { type: string }
        visitCostToServe: { type: number }
        netToCostMultiple: { type: number, description: "netRevenue / visitCostToServe" }
        marginRoiAvailable: { type: boolean, enum: [false] }
    MgmtDistributorTier:
      type: object
      required: [tier, score, visitCadence, creditPosture, inputs, cadenceDistributorPerMonth, cadenceRetailerPerMonth, rangeFocus, isOverridden]
      description: >
        A / B / C tier derived from a transparent 100-point composite score.
        A = >= 70, B = 45-69, C < 45. Inputs are shown so the classification
        can be argued with or overridden by the field team. D7 adds numeric
        cadences, range-focus actions, and a manual override flag.
      properties:
        tier:
          type: string
          enum: [A, B, C]
        score:
          type: integer
          description: Composite score 0–100.
        visitCadence: { type: string }
        creditPosture: { type: string }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/MgmtDistributorTierInput" }
        cadenceDistributorPerMonth:
          type: number
          description: Recommended visits per month to the distributor office (A=4, B=2, C=1).
        cadenceRetailerPerMonth:
          type: number
          description: Total retailer visits per month demanded by this tier (activeCount × rate).
        rangeFocus:
          type: array
          items: { type: string }
          description: Ordered list of whitespace/range actions for this tier.
        isOverridden:
          type: boolean
          description: True when the tier has been manually overridden via the PUT endpoint.
        overrideReason:
          type: string
          nullable: true
          description: Human-readable justification for the override, set when isOverridden = true.
    MgmtDistributorTierInput:
      type: object
      required: [label, value, score, note]
      properties:
        label: { type: string }
        value: { type: string }
        score: { type: integer }
        note: { type: string }
    MgmtRoiCost:
      type: object
      required: [ctcMonthly, taBillYtd, elapsedCompleteMonths, ctcCostYtd, totalCost, marginRoiAvailable]
      description: >
        Phase 4: revenue-to-cost analysis for a field representative.
        Cost = CTC (monthly × elapsed complete fiscal months) + T.A. Bill (YTD cumulative).
        Margin ROI requires a Cost Master and is never backed by MRP or purchase price.
      properties:
        ctcMonthly:
          type: number
          description: Monthly CTC salary from the Data tab.
        taBillYtd:
          type: number
          description: T.A. Bill, YTD cumulative, from the Data tab.
        elapsedCompleteMonths:
          type: integer
          description: Whole fiscal months elapsed from April 1 to today (July 23 → 3).
        ctcCostYtd:
          type: number
          description: ctcMonthly × elapsedCompleteMonths.
        totalCost:
          type: number
          description: ctcCostYtd + taBillYtd.
        obToCostMultiple:
          type: number
          nullable: true
          description: Order Booking ÷ totalCost. Higher = more efficient.
        saleToCostMultiple:
          type: number
          nullable: true
          description: Sale received ÷ totalCost.
        costPerRetailer:
          type: number
          nullable: true
          description: totalCost ÷ total retailers in the member's sheet.
        costPerVisit:
          type: number
          nullable: true
          description: totalCost ÷ total visits done (YTD).
        costPerActiveRetailer:
          type: number
          nullable: true
          description: totalCost ÷ active retailers (retailers with OB or Sale > 0).
        costRatioPct:
          type: number
          nullable: true
          description: (totalCost ÷ OB) × 100. Lower = more efficient.
        marginRoiAvailable:
          type: boolean
          description: >
            Always false until a Cost Master with finished-goods cost is loaded.
            MRP and purchase price are never used as cost proxies.
    MgmtRetailerDetail:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not-mapped, error, loading]
          description: >
            'ok' — retailer table loaded successfully.
            'not-mapped' — member has no working sheet mapped yet; Phase 1 KPIs still returned.
            'error' — sheet could not be read.
        error:
          type: string
          nullable: true
          description: Human-readable reason when status is not 'ok'.
        fileId:
          type: string
          nullable: true
          description: Google Sheets file ID of the member's working sheet.
        tabName:
          type: string
          nullable: true
          description: Name of the tab that was read.
        rows:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MgmtRetailerRow"
        spread:
          nullable: true
          $ref: "#/components/schemas/MgmtRetailerSpread"
        visitPlan:
          nullable: true
          $ref: "#/components/schemas/MgmtVisitPlan"
          description: "Phase 3: visit-pattern analysis and forward visit plan (present when status is 'ok')."
        months:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MgmtMonthActual"
          description: "Phase 7: per-month Plan / Order Booking / Sale Received from the member's FY tab. Empty array when the tab is not found or not parseable."
        rowsRead:
          type: integer
          nullable: true
    MgmtMonthActual:
      type: object
      required: [month]
      properties:
        month:
          type: string
          description: "Month abbreviation: Apr | May | Jun | Jul | Aug | Sep | Oct | Nov | Dec | Jan | Feb | Mar."
        plan:
          type: number
          nullable: true
          description: "Monthly plan figure from the member's own FY tab."
        orderBooking:
          type: number
          nullable: true
          description: "Monthly secondary order booking actual."
        sale:
          type: number
          nullable: true
          description: "Monthly sale received actual."
    MgmtRetailerRow:
      type: object
      required: [name, orderBooking, sale, isActive]
      properties:
        name: { type: string }
        district: { type: string, nullable: true }
        city: { type: string, nullable: true }
        distributor: { type: string, nullable: true }
        distanceKm: { type: number, nullable: true }
        businessPlan: { type: number, nullable: true }
        visitsRequired: { type: number, nullable: true }
        orderBooking: { type: number }
        sale: { type: number }
        totalVisit: { type: number, nullable: true }
        achievementPct: { type: number, nullable: true }
        isActive: { type: boolean }
    MgmtRetailerSpread:
      type: object
      required: [totalRetailers, activeRetailers, dormantRetailers, activePct, totalOrderBooking, totalSale]
      properties:
        totalRetailers: { type: integer }
        activeRetailers: { type: integer, description: "Retailers with OB > 0 or Sale > 0." }
        dormantRetailers: { type: integer }
        activePct: { type: number, description: "activeRetailers / totalRetailers × 100." }
        totalOrderBooking: { type: number }
        totalSale: { type: number }
        totalVisits: { type: number, nullable: true }
        top5ObShare: { type: number, nullable: true, description: "Top-5 retailers' OB share (%)." }
        top10ObShare: { type: number, nullable: true, description: "Top-10 retailers' OB share (%)." }
        concentrationIndex: { type: number, nullable: true, description: "HHI: 0–10000; higher = more concentrated." }
        businessPerActiveRetailer: { type: number, nullable: true }
        businessPerVisit: { type: number, nullable: true }
        annualBusinessPlan: { type: number, nullable: true, description: "Sum of retailer-row plan values from the Summary Report tab (col W). Falls back to the FY-tab scan only when the Summary Report has no plan column. The FY-tab TOTAL row is never used — it may not foot." }
    MgmtDistanceBucket:
      type: object
      required: [label, minKm, count, visitsDone, avgVisits, avgOb, activeCount]
      properties:
        label: { type: string, description: "e.g. 'Near (<=15 km)'" }
        minKm: { type: number }
        maxKm: { type: number, nullable: true }
        count: { type: integer }
        visitsDone: { type: number }
        avgVisits: { type: number }
        avgOb: { type: number }
        activeCount: { type: integer }
    MgmtVisitPattern:
      type: object
      required: [totalVisitsDone, totalVisitsRequired, proRatedRequired, visitDeficit, visitedZeroOrderCount, distanceBuckets]
      properties:
        totalVisitsDone: { type: number }
        totalVisitsRequired: { type: number }
        proRatedRequired:
          type: number
          description: "totalVisitsRequired × (elapsedMonths / 12). Pro-rated target for the FY portion elapsed."
        visitDeficit:
          type: number
          description: "proRatedRequired − totalVisitsDone. Positive = behind schedule."
        visitedZeroOrderCount: { type: integer }
        visitedZeroOrderRetailers:
          type: array
          items: { type: string }
          description: "Names of retailers visited at least once but with zero OB and zero sale (capped at 30)."
        distanceBuckets:
          type: array
          items:
            $ref: "#/components/schemas/MgmtDistanceBucket"
    MgmtHistoricalFyCapacity:
      type: object
      required: [fy, totalRetailers, totalVisitsRequired, totalVisitsDone, coveragePct]
      properties:
        fy: { type: string, description: "Fiscal year, e.g. '2024-25'." }
        totalRetailers: { type: integer, description: "Retailer rows in that FY's summary tab." }
        totalVisitsRequired: { type: integer, description: "Sum of visitsRequired across all retailers." }
        totalVisitsDone: { type: integer, description: "Sum of totalVisit across all retailers (annual capacity anchor)." }
        coveragePct: { type: number, description: "totalVisitsDone / totalVisitsRequired × 100." }
    MgmtVisitCapacity:
      type: object
      required: [fyStartDate, dataWindowEndDate, dataCutoffWorkingDays, demonstratedVisitsPerDay, annualCapacityAnchor, anchorFy, feasibleRemainingVisits, remainingRequired, gap, workingDaysRemaining, monthlyCapacity]
      properties:
        fyStartDate: { type: string, description: "FY start date, e.g. '2026-04-01'." }
        dataWindowEndDate: { type: string, description: "End of last complete fiscal month — the data cutoff. Never today's raw date." }
        dataCutoffWorkingDays: { type: integer, description: "Mon-Sat days from FY start to dataWindowEndDate (78 for Q1)." }
        demonstratedVisitsPerDay: { type: number, description: "totalVisitsDone / dataCutoffWorkingDays. Pace check only — not used for capacity projection." }
        annualCapacityAnchor: { type: integer, description: "Most recent closed FY's total visits. Used as the annual capacity anchor." }
        anchorFy: { type: string, description: "Which closed FY the anchor is drawn from, e.g. '2025-26'." }
        feasibleRemainingVisits: { type: integer, description: "annualCapacityAnchor − totalVisitsDone." }
        remainingRequired: { type: integer, description: "totalVisitsRequired − totalVisitsDone." }
        gap:
          type: integer
          description: "feasibleRemainingVisits − remainingRequired. Negative = shortfall. Anchor-based; never projected from daily rate."
        workingDaysRemaining: { type: integer, description: "Mon-Sat days from dataWindowEnd+1 to FY end (reference only)." }
        monthlyCapacity: { type: integer, description: "Approx feasibleRemainingVisits / remaining forward plan months." }
    MgmtVisitTarget:
      type: object
      required: [name, ob, visitsDone, priority, reason]
      properties:
        name: { type: string }
        district: { type: string, nullable: true }
        distanceKm: { type: number, nullable: true }
        ob: { type: number }
        businessPlan: { type: number, nullable: true }
        visitsDone: { type: number }
        priority:
          type: string
          enum: [maintain, develop, reduce]
          description: "maintain = active at cadence; develop = dormant high-potential; reduce = visited-zero-order."
        reason: { type: string }
    MgmtMonthVisitPlan:
      type: object
      required: [month, workingDays, capacity, maintenanceVisits, developmentVisits, targets]
      properties:
        month: { type: string, description: "e.g. 'Aug 26'" }
        workingDays: { type: integer }
        capacity: { type: integer, description: "Proportional share of feasibleRemainingVisits for this month's working days." }
        maintenanceVisits:
          type: integer
          description: "Visits allocated to active retailers to maintain their cadence."
        developmentVisits:
          type: integer
          description: "Remaining capacity directed at dormant high-potential retailers."
        targets:
          type: array
          items:
            $ref: "#/components/schemas/MgmtVisitTarget"
          description: "Top-10 prioritised retailers for this month, batched by district+km."
    MgmtVisitPlan:
      type: object
      required: [pattern, capacity, historicalFyCapacity, monthPlans, totalFeasible, totalRequired, gap]
      properties:
        pattern:
          $ref: "#/components/schemas/MgmtVisitPattern"
        capacity:
          $ref: "#/components/schemas/MgmtVisitCapacity"
        historicalFyCapacity:
          type: array
          items:
            $ref: "#/components/schemas/MgmtHistoricalFyCapacity"
          description: "Closed-year visit totals used to derive the capacity anchor. Sorted by FY descending."
        monthPlans:
          type: array
          items:
            $ref: "#/components/schemas/MgmtMonthVisitPlan"
        totalFeasible:
          type: number
          description: "Sum of monthly capacity allocations (may differ by 1–2 from feasibleRemainingVisits due to rounding)."
        totalRequired:
          type: number
          description: "Visits still required to complete the annual plan (= capacity.remainingRequired)."
        gap:
          type: number
          description: "Anchor-based gap: capacity.feasibleRemainingVisits − capacity.remainingRequired. Negative = shortfall."
    MgmtDeepDiveKpis:
      type: object
      required: [stateHead, name, normKey]
      properties:
        stateHead: { type: string }
        name: { type: string }
        normKey: { type: string }
        hq: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        contact: { type: string, nullable: true }
        primaryTarget: { type: number, nullable: true }
        secondaryTarget: { type: number, nullable: true }
        monthlyTarget: { type: number, nullable: true }
        orderBooking: { type: number, nullable: true }
        directDealersOrder: { type: number, nullable: true }
        sale: { type: number, nullable: true }
        achievementPct: { type: number, nullable: true }
        ctcMonthly: { type: number, nullable: true }
        ctcAnnual: { type: number, nullable: true }
        taBillStCost: { type: number, nullable: true }
        costRatio: { type: number, nullable: true }
        totalOldRetailers: { type: number, nullable: true }
        visitedRetailers: { type: number, nullable: true }
        nonVisitedRetailers: { type: number, nullable: true }
        newPartyOrderBooking: { type: number, nullable: true }
        businessPerRetailer: { type: number, nullable: true }
        totalRetailers: { type: number, nullable: true }
        directDealersCount: { type: number, nullable: true }
        # Phase 7: target details
        primaryTargetMonthly:
          type: number
          nullable: true
          description: "BK: Monthly Direct Dealer Primary Target."
        secondaryTargetMonthly:
          type: number
          nullable: true
          description: "Derived: monthlyTarget − primaryTargetMonthly."
        totalTargetToDate:
          type: number
          nullable: true
          description: "BM: Total target to date (secondary + primary)."
        elapsedMonths:
          type: number
          nullable: true
          description: "Derived: round(totalTargetToDate / monthlyTarget). Integer months elapsed from April 1."
        # Phase 7: 4 achievement ratios (replaces the blended achievementPct)
        achievementSecondary:
          type: number
          nullable: true
          description: "orderBooking / secondaryTarget × 100."
        achievementDirectDealer:
          type: number
          nullable: true
          description: "directDealersOrder / primaryTarget × 100."
        achievementTotal:
          type: number
          nullable: true
          description: "(orderBooking + directDealersOrder) / totalTargetToDate × 100."
        achievementSale:
          type: number
          nullable: true
          description: "sale / totalTargetToDate × 100."
        # Phase 7: prior year quarterly actuals (BO–BR)
        lastYearQ1: { type: number, nullable: true, description: "Prior year Q1 actual." }
        lastYearQ2: { type: number, nullable: true, description: "Prior year Q2 actual." }
        lastYearQ3: { type: number, nullable: true, description: "Prior year Q3 actual." }
        lastYearQ4: { type: number, nullable: true, description: "Prior year Q4 actual." }
        extra:
          type: object
          additionalProperties: true
    MgmtOptions:
      type: object
      properties:
        fys:
          type: array
          items:
            type: string
          description: Fiscal years selectable in the report, newest first.
        defaultFy:
          type: string
          description: Fiscal year preselected in the UI.
        regions:
          type: array
          items:
            $ref: "#/components/schemas/MgmtRegion"
        states:
