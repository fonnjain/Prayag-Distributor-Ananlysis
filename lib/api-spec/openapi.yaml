    MgmtReportRequest:
      type: object
      properties:
        fy:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: Fiscal year, e.g. 2026-27.
        regions:
          type: array
          items:
            type: string
          description: Region names to include (expanded to states server-side).
        states:
          type: array
          items:
            type: string
          description: Individual states to include (combined with regions).
        monthFrom:
          type: integer
          minimum: 1
          maximum: 12
          description: First fiscal month included (1 = April).
        monthTo:
          type: integer
          minimum: 1
          maximum: 12
          description: Last fiscal month included (12 = March).
        lowPerfPct:
          type: integer
          minimum: 1
          maximum: 100
          description: Low-performer achievement threshold percent (default 60).
      required:
        - fy
    MgmtVerifyCheck:
      type: object
      properties:
        key:
          type: string
          description: Stable identifier for the check.
        label:
          type: string
          description: Human-readable label for the check.
        unit:
          type: string
          enum: [money, count]
          description: Whether the values are rupees or a count.
        expected:
          type: number
          description: Signed-off anchor value.
        actual:
          type: number
          description: The app's computed value.
        deltaPct:
          type: number
          nullable: true
          description: Percentage difference of actual vs expected.
        status:
          type: string
          enum: [pass, warn, fail]
      required:
        - key
        - label
        - unit
        - expected
        - actual
        - deltaPct
        - status
    MgmtVerifyContext:
      type: object
      description: Registered vs Active counts and Active% for retailers and members, plus roster-match remainder.
      properties:
        registeredRetailers:
          type: number
          nullable: true
          description: Registered retailers (retailer master; null when not loaded in-app).
        activeRetailers:
          type: number
          description: Retailers with at least one order in the FY.
        activeRetailerPct:
          type: number
          nullable: true
          description: Active retailers as a percent of registered retailers.
        registeredMembers:
          type: number
          description: Registered team members in the roster spine.
        activeMembers:
          type: number
          description: Distinct team-member names that booked at least one order.
        activeMemberPct:
          type: number
          nullable: true
          description: Roster-matched active members as a percent of registered members.
        unmatchedNames:
          type: number
          description: Order-booking names that matched no roster member.
        unmatchedSale:
          type: number
          description: Net Sale carried by unmatched names (company total minus roster-attributed total).
      required:
        - registeredRetailers
        - activeRetailers
        - activeRetailerPct
        - registeredMembers
        - activeMembers
        - activeMemberPct
        - unmatchedNames
        - unmatchedSale
    MgmtVerifyCrossFoot:
      type: object
      properties:
        memberSaleTotal:
          type: number
          description: Sum of per-member Sale.
        headSaleTotal:
          type: number
          description: Sum of per-head Sale.
        companyTotal:
          type: number
          description: Company Sale Report total.
        withinTolerance:
          type: boolean
          description: True when all three totals agree within tolerance.
      required:
        - memberSaleTotal
        - headSaleTotal
        - companyTotal
        - withinTolerance
    MgmtVerifyResult:
      type: object
      properties:
        fy:
          type: string
        available:
          type: boolean
          description: False when the file or anchors could not be loaded.
        reason:
          type: string
          description: Why verification could not run (present when unavailable).
        overall:
          type: string
          enum: [pass, warn, fail]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/MgmtVerifyCheck"
        context:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MgmtVerifyContext"
        crossFoot:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MgmtVerifyCrossFoot"
        missingHeads:
          type: array
          items:
            type: string
          description: Anchor heads that computed to zero (dropped in output).
      required:
        - fy
        - available
        - overall
        - checks
        - context
        - crossFoot
        - missingHeads
