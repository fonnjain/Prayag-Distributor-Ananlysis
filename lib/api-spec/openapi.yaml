    CustomerMismatchRow:
      type: object
      required: [id, customerName, sheetHead, fy, detectedAt]
      properties:
        id: { type: integer }
        customerId: { type: string, nullable: true }
        customerName: { type: string }
        masterHead: { type: string, nullable: true }
        sheetHead: { type: string }
        fy: { type: string }
        detectedAt: { type: string }
        resolvedAt: { type: string, nullable: true }
        resolvedBy: { type: string, nullable: true }
        resolution: { type: string, nullable: true }
        reason: { type: string, nullable: true }
    CustomerMismatchListResponse:
      type: object
      required: [rows, pendingCount]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/CustomerMismatchRow" }
        pendingCount: { type: integer }
    CustomerMismatchCountResponse:
      type: object
      required: [pendingCount]
      properties:
        pendingCount: { type: integer }
    CustomerMismatchResolveRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [approved, dismissed] }
        resolvedBy: { type: string }
        reason: { type: string }
    MgmtWinBackItem:
      type: object
      required: [customer, lastActiveFy, lastActiveMonth, lastNet]
      description: >
        Phase 6: a retailer/customer present in the member's past-FY secondary register
        (FY2024-25 or FY2025-26) but absent from the current working sheet.
      properties:
        customer:
          type: string
          description: Customer name as written in the secondary register.
        lastActiveFy:
          type: string
          description: The most recent fiscal year in which this customer appeared.
        lastActiveMonth:
          type: string
          description: The last month label in which this customer appeared (e.g. Mar-26).
        lastNet:
          type: number
          description: Rounded total net_amount for this customer in their last active FY.
    MgmtSegmentNet:
      type: object
      required: [segment, net, pct]
      properties:
        segment:
          type: string
          description: Canonical segment/brand name (brand_canon from secondary_register_line).
        net:
          type: number
          description: NET (Sub Total) for this segment in rupees.
        pct:
          type: number
          description: Share of this segment in the member's total NET (0–100).
    MgmtSkuSpread:
      type: object
      required: [isLiveYear]
      description: >
        Phase 5: segment and SKU spread from secondary_register_line.
        NET = net_amount (Sub Total), never gross_amount.
        For the live year (FY2026-27) isLiveYear is true and no metrics are present.
      properties:
        isLiveYear:
          type: boolean
          description: True when the selected FY has no secondary register ingested yet (live year).
        liveYearNote:
          type: string
          nullable: true
          description: Human-readable note explaining that data will appear when a register is ingested.
        totalRows:
          type: integer
          nullable: true
          description: Total secondary_register_line rows for this member in the FY.
        totalNet:
          type: number
          nullable: true
          description: Sum of net_amount (Sub Total) across all rows.
        distinctSegments:
          type: integer
          nullable: true
          description: Distinct brand_canon values present in the member's rows.
        totalKnownSegments:
          type: integer
          nullable: true
          description: Distinct brand_canon values across ALL members for this FY (the full segment universe).
        coveragePct:
          type: number
          nullable: true
          description: distinctSegments / totalKnownSegments × 100.
        netBySegment:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MgmtSegmentNet"
          description: NET by segment, sorted descending by net. Also serves as the top-SKU list.
        crossSellDepth:
          type: number
          nullable: true
          description: Average number of distinct segments ordered by each customer.
        concentrationHhi:
          type: number
          nullable: true
          description: >
            Herfindahl-Hirschman Index over segment NET shares (0–10000).
            Higher = more concentrated. <2500 = diversified, 2500–5000 = moderate, >5000 = concentrated.
    MgmtRetailerConcentration:
      type: object
      required: [totalOb, top5Ob, top10Ob]
      description: >
        D7: within a single distributor's own retailer list (direct dealers excluded),
        the top-5 and top-10 OB concentration and the highest single account.
      properties:
        totalOb: { type: number, description: "Distributor's total order booking." }
        top5Ob: { type: number, description: "OB sum of top-5 retailers by OB." }
        top5SharePct: { type: number, nullable: true, description: "top5Ob / totalOb × 100." }
        top10Ob: { type: number, description: "OB sum of top-10 retailers by OB." }
        top10SharePct: { type: number, nullable: true, description: "top10Ob / totalOb × 100." }
        topRetailerName: { type: string, nullable: true, description: "Name of the highest-OB retailer." }
        topRetailerOb: { type: number, nullable: true, description: "OB of the highest-OB retailer." }
        topRetailerSharePct: { type: number, nullable: true, description: "topRetailerOb / totalOb × 100." }
    MgmtCapacityCheck:
      type: object
      required: [demandedPerMonth, hasShortfall, breakdown]
      description: >
        D7: territory visit-capacity reconciliation. Compares the total retailer visits
        per month demanded by all distributor tier cadences against the member's actual
        YTD visit rate. Surfaces a shortfall when demand exceeds available capacity.
      properties:
        availablePerMonth:
          type: number
          nullable: true
          description: YTD visit total / elapsed months. Null when no visit data is available.
        demandedPerMonth:
          type: number
          description: Sum of cadenceRetailerPerMonth across all distributors with a computed tier.
        shortfallPerMonth:
          type: number
          nullable: true
          description: demandedPerMonth - availablePerMonth when positive, else null.
        hasShortfall:
          type: boolean
        breakdown:
          type: array
          items:
            type: object
            required: [normKey, name, tier, demandedRetailerVisitsPerMonth]
            properties:
              normKey: { type: string }
              name: { type: string }
              tier: { type: string, enum: [A, B, C] }
              demandedRetailerVisitsPerMonth: { type: number }
    MgmtDistributorTierOverride:
      type: object
      required: [id, stateHead, fy, normKey, tier, reason, overriddenAt]
      description: A persisted manual tier override for one distributor in a territory + FY.
      properties:
        id: { type: integer }
        stateHead: { type: string }
        fy: { type: string }
        normKey: { type: string }
        tier: { type: string, enum: [A, B, C] }
        reason: { type: string }
        overriddenAt: { type: string, format: date-time }
    MgmtDistributorTierOverrideInput:
      type: object
      required: [stateHead, fy, normKey, tier, reason]
      properties:
        stateHead: { type: string }
        fy: { type: string }
        normKey: { type: string }
        tier: { type: string, enum: [A, B, C] }
    AiPayload:
      type: object
      description: >
        Phase A1 verified metrics payload. Every figure is computed by the app
        from already-loaded Deep Dive data. No Anthropic API call is made when
        building this payload. Later phases receive this object and generate
        narrative; they never perform arithmetic on raw sheet rows.
      required:
        - identity
        - targets
        - performance
        - achievement
        - coverage
        - priorYears
        - dataQuality
        - provenance
      properties:
        identity:
          type: object
          additionalProperties: true
          description: "Who + when + period context."
          properties:
            fy:            { type: string }
            stateHead:     { type: string, nullable: true }
            member:        { type: string, nullable: true }
            hq:            { type: string, nullable: true }
            period:        { type: string }
            dataCutoff:    { type: string, description: "ISO date of last complete fiscal month end." }
            elapsedMonths: { type: integer }
            workingDays:   { type: number, nullable: true }
            isClosedFy:    { type: boolean }
            generatedAt:   { type: string, format: date-time }
        targets:
          type: object
          additionalProperties: true
          description: "Monthly and to-date targets from the Data tab."
        performance:
          type: object
          additionalProperties: true
          description: "Secondary OB, Direct Dealer OB, total OB, sales received."
        achievement:
          type: object
          additionalProperties: true
          description: "Achievement ratios (always recomputed, never from sheet %)."
        coverage:
          type: object
          additionalProperties: true
          description: "Retailer count breakdown."
        customerStates:
          type: object
          nullable: true
          additionalProperties: true
          description: "retained / reactivated / atRisk / never groups."
        topCustomers:
          type: object
          nullable: true
          additionalProperties: true
          description: "Top 5 and top 10 by order booking."
        concentration:
          type: object
          nullable: true
          additionalProperties: true
          description: "top5SharePct, top10SharePct, HHI, effectiveRetailers."
        visits:
          type: object
          nullable: true
          additionalProperties: true
          description: "Visit done/required/coveragePct + distance bands."
        capacity:
          type: object
          nullable: true
          additionalProperties: true
          description: "Annual visit capacity model with projection band."
        cost:
          type: object
          nullable: true
          additionalProperties: true
          description: "CTC, TA bill, total cost, cost ratios and per-visit/retailer."
        productSpread:
          type: object
          nullable: true
          additionalProperties: true
          description: "Segment/SKU coverage from secondary_register_line (closed FYs)."
        priorYears:
          type: array
          items:
            type: object
            additionalProperties: true
          description: "Per-FY visit and OB history."
        dataQuality:
          type: array
          items:
            type: object
            required: [code, message, severity, fields]
            properties:
              code:     { type: string }
              message:  { type: string }
              severity: { type: string, enum: [info, warning, error] }
              fields:   { type: array, items: { type: string } }
        provenance:
          type: object
          additionalProperties: { type: string }
          description: "Per-section data-source description."
        teamSummary:
          type: object
          nullable: true
          additionalProperties: true
          description: "Present only for state-head aggregate payloads."
        reason: { type: string }
    ReportSection:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body:  { type: string }
    AiReportRequest:
      type: object
      required: [member]
      properties:
        fy:        { type: string, example: "2026-27" }
        stateHead: { type: string }
        member:    { type: string, description: "Member name or normSecKey." }
        period:    { type: string, default: "ytd" }
        corrupt:
          type: boolean
          default: false
          description: >
            Guard self-test mode. Injects a wrong monetary figure into the
            generated text before running the guard. Response includes
            corruptTestMode:true.
    AiReportResponse:
      type: object
      required: [fy, member, dataCutoff, generatedAt, sections, guard]
      properties:
        fy:           { type: string }
        member:       { type: string }
        stateHead:    { type: string, nullable: true }
        dataCutoff:   { type: string }
        generatedAt:  { type: string, format: date-time }
        sections:
          type: object
          required:
            - executiveSummary
            - performanceAgainstTarget
            - coverageAndCustomerBase
            - visitEffectiveness
            - costAndReturn
            - risksAndDataCaveats
          properties:
            executiveSummary:         { $ref: "#/components/schemas/ReportSection" }
            performanceAgainstTarget: { $ref: "#/components/schemas/ReportSection" }
            coverageAndCustomerBase:  { $ref: "#/components/schemas/ReportSection" }
            visitEffectiveness:       { $ref: "#/components/schemas/ReportSection" }
            costAndReturn:            { $ref: "#/components/schemas/ReportSection" }
            risksAndDataCaveats:      { $ref: "#/components/schemas/ReportSection" }
        guard:
          type: object
          required: [status, checked, unmatched]
          properties:
            status:
              type: string
              enum: [ok, requires_review]
            checked: { type: integer }
            unmatched:
              type: array
              items:
                type: object
                required: [extracted, value, sentence]
                properties:
                  extracted: { type: string }
                  value:     { type: number }
                  sentence:  { type: string }
        corruptTestMode:
          type: boolean
          nullable: true
