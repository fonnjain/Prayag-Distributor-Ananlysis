          type: array
          items:
            type: object
            properties:
              name: { type: string }
              role:
                type: string
                enum: [state_head, team_member]
              cadence:
                type: string
                enum: [annual, half_yearly, quarterly, monthly]
              values:
                type: array
                items: { type: number }
            required: [name, role, cadence, values]
      required: [fy, rows]
    SavePrimaryTargetsResult:
      type: object
