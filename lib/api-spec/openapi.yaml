    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
    VerifyBreakdown:
      type: object
      properties:
        key:
          type: string
          description: Canonical group or head name.
        amount:
          type: number
          description: Amount in INR.
      required:
        - key
        - amount
    VerifySourceAggregates:
      type: object
      properties:
        rows:
          type: integer
          description: Row count for the fiscal year.
        amount:
          type: number
          description: SUM(amount) in INR.
        invoices:
          type: integer
          description: Distinct invoice numbers.
        customers:
          type: integer
          description: Distinct customers.
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
        byHead:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
      required:
        - rows
        - amount
        - invoices
        - customers
        - byGroup
        - byHead
    VerifyDelta:
      type: object
      properties:
        metric:
          type: string
          description: Metric compared (rows, amount, invoices, customers).
        a:
          type: number
          description: Value from the first source.
        b:
          type: number
          description: Value from the second source.
        deltaPct:
          type: number
          description: Absolute percentage difference.
        flagged:
          type: boolean
          description: True when the delta exceeds 0.5 percent.
      required:
        - metric
        - a
        - b
        - deltaPct
        - flagged
    VerifyComparison:
      type: object
      properties:
        label:
          type: string
          description: Which two sources are compared.
        deltas:
          type: array
          items:
            $ref: "#/components/schemas/VerifyDelta"
        flagged:
          type: boolean
          description: True when any delta is over threshold.
      required:
        - label
        - deltas
        - flagged
    VerifyMissingRow:
      type: object
      properties:
        invoiceNo:
          type: string
          nullable: true
        code:
          type: string
        qty:
          type: number
          nullable: true
        amount:
          type: number
        monthLabel:
          type: string
          nullable: true
        customer:
          type: string
          nullable: true
      required:
        - code
        - amount
    VerifyReport:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year verified.
        generatedAt:
          type: string
          description: ISO timestamp of report generation.
        sources:
          type: object
          properties:
            xlsx:
              $ref: "#/components/schemas/VerifySourceAggregates"
            sheets:
              $ref: "#/components/schemas/VerifySourceAggregates"
            db:
              $ref: "#/components/schemas/VerifySourceAggregates"
          required:
            - xlsx
            - sheets
            - db
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/VerifyComparison"
        missingFromDb:
          type: object
          properties:
            count:
              type: integer
