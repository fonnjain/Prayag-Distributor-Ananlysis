      required:
        - monthLabel
        - monthName
        - amount
        - territoryAmount
        - institutionalAmount
        - maxInvoiceDate
        - complete
    AnalyticsYoy:
      type: object
      properties:
        current:
          type: number
        prior:
          type: number
        pct:
          type: number
          nullable: true
          description: Percent change; null when the prior period is zero.
      required:
        - current
        - prior
        - pct
    AnalyticsHeadStat:
      type: object
      properties:
        head:
          type: string
        amount:
          type: number
        sharePct:
          type: number
        isTerritory:
          type: boolean
      required:
        - head
        - amount
        - sharePct
        - isTerritory
    AnalyticsRetention:
      type: object
      properties:
        periodMonths:
          type: array
          items:
            type: string
        retained:
          type: integer
        newCustomers:
          type: integer
        lost:
          type: integer
        retainedRevenue:
          type: number
        newRevenue:
          type: number
        lostPriorRevenue:
          type: number
          description: Revenue lost customers generated in the prior period.
      required:
        - periodMonths
        - retained
        - newCustomers
        - lost
        - retainedRevenue
        - newRevenue
