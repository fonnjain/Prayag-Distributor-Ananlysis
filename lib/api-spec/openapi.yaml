        - files
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: The user's question for the sales analyst.
      required:
        - question
    AnalyzeResponse:
      type: object
      properties:
        answer:
          type: string
          description: Markdown-formatted analysis from the AI analyst.
      required:
        - answer
    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: The aggregated dashboard dataset payload.
        manifest:
          type: object
          additionalProperties: true
          description: Source manifest (file listing, counts, notes).
        syncedAt:
          type: string
          description: ISO timestamp of when this snapshot was built.
        sourceStatus:
          type: string
          description: "\"live\" if built from Google Sheets, \"seed\" if baseline."
        refreshError:
          type: string
          description: Present only when a refresh failed and stale data is served.
      required:
        - data
        - manifest
        - syncedAt
        - sourceStatus

    PrimaryTargetEntry:
      type: object
      properties:
        name:
          type: string
          description: Display name of the state head or team member.
        role:
          type: string
          enum: [state_head, team_member]
        cadence:
          type: string
          enum: [annual, half_yearly, quarterly, monthly]
        values:
          type: array
          items: { type: number }
          description: >
            1, 2, 4, or 12 rupee values depending on cadence.
        monthlyExpanded:
          type: array
          items: { type: number }
          description: >
            Precomputed 12-element array (Apr-Mar) derived from cadence +
            seasonal weights.
      required: [name, role, cadence, values, monthlyExpanded]
    PrimaryTargetsResponse:
      type: object
      properties:
        fy:
          type: string
        stateHeads:
          type: array
          items: { type: string }
          description: Display names of the 13 state heads for this FY.
        teamMembers:
          type: array
          items: { type: string }
          description: Display names of the 17 primary team members for this FY.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PrimaryTargetEntry"
        seasonalCalibration:
          $ref: "#/components/schemas/SeasonalCalibration"
      required: [fy, stateHeads, teamMembers, entries]
    SeasonalCalibration:
      type: object
      description: Seasonal monthly split curve used to expand annual primary targets into per-month targets. Retail/territorial basis only — institutional/tender business is not seasonalised.
      properties:
        fy:
          type: string
          description: The FY this calibration was derived from (e.g. "2025-26").
        derivedFrom:
          type: string
          description: Human-readable description of the calibration source.
        monthly:
          type: array
          items: { type: number }
          description: Normalised monthly shares (fractions, sum=1). Apr=index 0 … Mar=index 11.
        quarterly:
          type: array
          items: { type: number }
          description: Normalised quarterly shares (fractions, sum=1). Q1=index 0 … Q4=index 3.
        monthNames:
          type: array
          items: { type: string }
          description: Month display names Apr…Mar.
      required: [fy, derivedFrom, monthly, quarterly, monthNames]
    SavePrimaryTargetsRequest:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year like 2026-27.
        rows:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              role:
                type: string
                enum: [state_head, team_member]
              cadence:
                type: string
                enum: [annual, half_yearly, quarterly, monthly]
              values:
                type: array
                items: { type: number }
            required: [name, role, cadence, values]
      required: [fy, rows]
    SavePrimaryTargetsResult:
      type: object
      properties:
        saved:
          type: integer
          description: Number of rows upserted.
      required: [saved]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
    VerifyBreakdown:
      type: object
      properties:
        key:
          type: string
          description: Canonical group or head name.
        amount:
          type: number
          description: Amount in INR.
      required:
        - key
        - amount
    VerifySourceAggregates:
      type: object
      properties:
        rows:
          type: integer
          description: Row count for the fiscal year.
        amount:
          type: number
          description: SUM(amount) in INR.
        invoices:
          type: integer
          description: Distinct invoice numbers.
        customers:
          type: integer
          description: Distinct customers.
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
        byHead:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
      required:
        - rows
        - amount
        - invoices
        - customers
        - byGroup
        - byHead
    VerifyDelta:
      type: object
      properties:
        metric:
          type: string
          description: Metric compared (rows, amount, invoices, customers).
        a:
          type: number
          description: Value from the first source.
        b:
          type: number
          description: Value from the second source.
        deltaPct:
          type: number
          description: Absolute percentage difference.
        flagged:
          type: boolean
          description: True when the delta exceeds 0.5 percent.
      required:
        - metric
        - a
        - b
        - deltaPct
        - flagged
    VerifyComparison:
      type: object
      properties:
        label:
          type: string
          description: Which two sources are compared.
        deltas:
          type: array
          items:
            $ref: "#/components/schemas/VerifyDelta"
        flagged:
          type: boolean
          description: True when any delta is over threshold.
      required:
        - label
        - deltas
        - flagged
    VerifyMissingRow:
      type: object
      properties:
        invoiceNo:
          type: string
          nullable: true
        code:
          type: string
        qty:
          type: number
          nullable: true
        amount:
          type: number
        monthLabel:
          type: string
          nullable: true
        customer:
          type: string
          nullable: true
      required:
        - code
        - amount
    VerifyReport:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year verified.
        generatedAt:
          type: string
          description: ISO timestamp of report generation.
        sources:
          type: object
          properties:
            xlsx:
              $ref: "#/components/schemas/VerifySourceAggregates"
            sheets:
              $ref: "#/components/schemas/VerifySourceAggregates"
            db:
              $ref: "#/components/schemas/VerifySourceAggregates"
          required:
            - xlsx
            - sheets
            - db
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/VerifyComparison"
        missingFromDb:
          type: object
          properties:
            count:
              type: integer
              description: Live rows whose uid is not in the database.
            sample:
              type: array
              description: Up to 50 example missing rows.
              items:
                $ref: "#/components/schemas/VerifyMissingRow"
          required:
            - count
            - sample
        healthy:
          type: boolean
          description: True when nothing is missing and no delta is flagged.
      required:
        - fy
        - generatedAt
        - sources
        - comparisons
        - missingFromDb
        - healthy
    VerifyBackfillRequest:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year, e.g. 2026-27 (default).
    VerifyBackfillResponse:
      type: object
      properties:
        fy:
          type: string
        rowsRead:
          type: integer
          description: Live rows read for the fiscal year.
        inserted:
          type: integer
          description: Rows inserted (0 when already in sync).
      required:
        - fy
        - rowsRead
        - inserted
    AnalyticsMonthStat:
      type: object
      properties:
        monthLabel:
          type: string
          description: Month label like Apr-26.
        monthName:
          type: string
          description: Three-letter month name like Apr.
        amount:
          type: number
        territoryAmount:
          type: number
        institutionalAmount:
          type: number
        maxInvoiceDate:
          type: string
          nullable: true
