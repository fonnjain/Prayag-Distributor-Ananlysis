openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyst
    description: AI sales analyst operations
  - name: drive
    description: Google Drive file operations
  - name: dashboard
    description: Live dashboard data operations
  - name: verify
    description: Data health and reconciliation operations
  - name: mgmt
    description: Management report generation
paths:
  /drive/files:
    get:
      operationId: listDriveFiles
      tags: [drive]
      summary: List Google Drive files
      description: >
        Lists files from the connected Google Drive account, optionally
        filtered by a search query. Results are ordered by most recently
        modified.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional search text matched against file names.
          schema:
            type: string
            maxLength: 200
        - name: pageToken
          in: query
          required: false
          description: Token for fetching the next page of results.
          schema:
            type: string
      responses:
        "200":
          description: List of Drive files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveFileList"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeSales
      tags: [analyst]
      summary: Ask the AI sales analyst
      description: >
        Sends a natural-language question about Prayag India sales, orders,
        coverage, and product data to the AI analyst and returns a markdown
        answer grounded in the embedded dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analyst answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the latest dashboard snapshot
      description: >
        Returns the most recent aggregated dashboard dataset, built from the
        connected Google Sheets. Falls back to a seeded baseline before the
        first live sync completes.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /dashboard/refresh:
    post:
      operationId: refreshDashboard
      tags: [dashboard]
      summary: Rebuild the dashboard from Google Sheets
      description: >
        Re-reads the source Google Sheets, rebuilds the aggregate dataset, and
        stores a new snapshot. If the refresh fails, the last good snapshot is
        returned with a refreshError message.
      responses:
        "200":
          description: Refreshed dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /verify:
    get:
      operationId: getVerifyReport
      tags: [verify]
      summary: Data health reconciliation report
      description: >
        Compares three sources for the same fiscal year — xlsx as ingested,
        live Google Sheets read now, and the database — reporting row counts,
        amount sums, distinct invoices/customers, by-group and by-head
        breakdowns, deltas over 0.5 percent, and live rows missing from the
        database.
      parameters:
        - name: fy
          in: query
          required: false
          description: Fiscal year, e.g. 2026-27 (default).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyReport"
        "400":
          description: Unknown fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Report could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /verify/backfill:
    post:
      operationId: runVerifyBackfill
      tags: [verify]
      summary: Backfill rows missing from the database
      description: >
        Re-reads the live register for the fiscal year and inserts any lines
        whose uid is not yet in the database. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyBackfillResponse"
        "400":
          description: Unknown fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Backfill failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analytics:
    get:
      operationId: getAnalytics
      tags: [verify]
      summary: Corrected analytics on the invoice-line register
      description: >
        Year-over-year growth over complete months only (partial months are
        flagged and excluded), split into territory vs institutional business,
        plus per-head totals, customer retention over the comparable period,
        and margins (empty until a cost master is loaded).
      parameters:
        - name: fy
          in: query
          required: false
          description: Fiscal year, e.g. 2026-27 (default).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: compare
          in: query
          required: false
          description: Comparison fiscal year (defaults to the prior year).
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Analytics report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"
        "400":
          description: Bad fiscal year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Analytics could not be computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/options:
    get:
      operationId: getMgmtOptions
      tags: [mgmt]
      summary: Filter options for management reports
      description: >
        Returns the available fiscal years, region-to-state map, roster
        states, and the connection status of each data source used by the
        STATE HEAD DASHBOARD report.
      responses:
        "200":
          description: Report filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgmtOptions"
        "500":
          description: Options could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mgmt/report:
    post:
      operationId: generateMgmtReport
      tags: [mgmt]
      summary: Generate the STATE HEAD DASHBOARD Excel report
      description: >
        Builds the STATE HEAD DASHBOARD workbook from live Google Sheets for
        the selected fiscal year and scope, and streams it as an xlsx
        download. Columns whose source is not connected yet are left blank
        with a grey fill and listed in the Missing Data tab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MgmtReportRequest"
      responses:
        "200":
          description: The generated Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No team members match the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Report generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    DriveFile:
      type: object
      properties:
        id:
          type: string
          description: Google Drive file id.
        name:
          type: string
          description: File name.
        mimeType:
          type: string
          description: MIME type of the file.
        iconLink:
          type: string
          description: URL to a small icon representing the file type.
        webViewLink:
          type: string
          description: URL to open the file in the browser.
        modifiedTime:
          type: string
          description: ISO timestamp of the last modification.
        size:
          type: string
          description: File size in bytes, as a string (absent for folders and native Google files).
      required:
        - id
        - name
        - mimeType
    DriveFileList:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/DriveFile"
        nextPageToken:
          type: string
          description: Token to fetch the next page, if more results exist.
      required:
        - files
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: The user's question for the sales analyst.
      required:
        - question
    AnalyzeResponse:
      type: object
      properties:
        answer:
          type: string
          description: Markdown-formatted analysis from the AI analyst.
      required:
        - answer
    DashboardResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: The aggregated dashboard dataset payload.
        manifest:
          type: object
          additionalProperties: true
          description: Source manifest (file listing, counts, notes).
        syncedAt:
          type: string
          description: ISO timestamp of when this snapshot was built.
        sourceStatus:
          type: string
          description: "\"live\" if built from Google Sheets, \"seed\" if baseline."
        refreshError:
          type: string
          description: Present only when a refresh failed and stale data is served.
      required:
        - data
        - manifest
        - syncedAt
        - sourceStatus

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
    VerifyBreakdown:
      type: object
      properties:
        key:
          type: string
          description: Canonical group or head name.
        amount:
          type: number
          description: Amount in INR.
      required:
        - key
        - amount
    VerifySourceAggregates:
      type: object
      properties:
        rows:
          type: integer
          description: Row count for the fiscal year.
        amount:
          type: number
          description: SUM(amount) in INR.
        invoices:
          type: integer
          description: Distinct invoice numbers.
        customers:
          type: integer
          description: Distinct customers.
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
        byHead:
          type: array
          items:
            $ref: "#/components/schemas/VerifyBreakdown"
      required:
        - rows
        - amount
        - invoices
        - customers
        - byGroup
        - byHead
    VerifyDelta:
      type: object
      properties:
        metric:
          type: string
          description: Metric compared (rows, amount, invoices, customers).
        a:
          type: number
          description: Value from the first source.
        b:
          type: number
          description: Value from the second source.
        deltaPct:
          type: number
          description: Absolute percentage difference.
        flagged:
          type: boolean
          description: True when the delta exceeds 0.5 percent.
      required:
        - metric
        - a
        - b
        - deltaPct
        - flagged
    VerifyComparison:
      type: object
      properties:
        label:
          type: string
          description: Which two sources are compared.
        deltas:
          type: array
          items:
            $ref: "#/components/schemas/VerifyDelta"
        flagged:
          type: boolean
          description: True when any delta is over threshold.
      required:
        - label
        - deltas
        - flagged
    VerifyMissingRow:
      type: object
      properties:
        invoiceNo:
          type: string
          nullable: true
        code:
          type: string
        qty:
          type: number
          nullable: true
        amount:
          type: number
        monthLabel:
          type: string
          nullable: true
        customer:
          type: string
          nullable: true
      required:
        - code
        - amount
    VerifyReport:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year verified.
        generatedAt:
          type: string
          description: ISO timestamp of report generation.
        sources:
          type: object
          properties:
            xlsx:
              $ref: "#/components/schemas/VerifySourceAggregates"
            sheets:
              $ref: "#/components/schemas/VerifySourceAggregates"
            db:
              $ref: "#/components/schemas/VerifySourceAggregates"
          required:
            - xlsx
            - sheets
            - db
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/VerifyComparison"
        missingFromDb:
          type: object
          properties:
            count:
              type: integer
              description: Live rows whose uid is not in the database.
            sample:
              type: array
              description: Up to 50 example missing rows.
              items:
                $ref: "#/components/schemas/VerifyMissingRow"
          required:
            - count
            - sample
        healthy:
          type: boolean
          description: True when nothing is missing and no delta is flagged.
      required:
        - fy
        - generatedAt
        - sources
        - comparisons
        - missingFromDb
        - healthy
    VerifyBackfillRequest:
      type: object
      properties:
        fy:
          type: string
          description: Fiscal year, e.g. 2026-27 (default).
    VerifyBackfillResponse:
      type: object
      properties:
        fy:
          type: string
        rowsRead:
          type: integer
          description: Live rows read for the fiscal year.
        inserted:
          type: integer
          description: Rows inserted (0 when already in sync).
      required:
        - fy
        - rowsRead
        - inserted
    AnalyticsMonthStat:
      type: object
      properties:
        monthLabel:
          type: string
          description: Month label like Apr-26.
        monthName:
          type: string
          description: Three-letter month name like Apr.
        amount:
          type: number
        territoryAmount:
          type: number
        institutionalAmount:
          type: number
        maxInvoiceDate:
          type: string
          nullable: true
        complete:
          type: boolean
          description: >
            True only if the max invoice date reaches the last calendar day
            of the month. Incomplete months are excluded from YoY.
      required:
        - monthLabel
        - monthName
        - amount
        - territoryAmount
        - institutionalAmount
        - maxInvoiceDate
        - complete
    AnalyticsYoy:
      type: object
      properties:
        current:
          type: number
        prior:
          type: number
        pct:
          type: number
          nullable: true
          description: Percent change; null when the prior period is zero.
      required:
        - current
        - prior
        - pct
    AnalyticsHeadStat:
      type: object
      properties:
        head:
          type: string
        amount:
          type: number
        sharePct:
          type: number
        isTerritory:
          type: boolean
      required:
        - head
        - amount
        - sharePct
        - isTerritory
    AnalyticsRetention:
      type: object
      properties:
        periodMonths:
          type: array
          items:
            type: string
        retained:
          type: integer
        newCustomers:
          type: integer
        lost:
          type: integer
        retainedRevenue:
          type: number
        newRevenue:
          type: number
        lostPriorRevenue:
          type: number
          description: Revenue lost customers generated in the prior period.
      required:
        - periodMonths
        - retained
        - newCustomers
        - lost
        - retainedRevenue
        - newRevenue
        - lostPriorRevenue
    AnalyticsMarginGroup:
      type: object
      properties:
        group:
          type: string
        revenue:
          type: number
        margin:
          type: number
      required:
        - group
        - revenue
        - margin
    AnalyticsMargins:
      type: object
      properties:
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMarginGroup"
          description: Empty until a cost master is loaded.
        coveragePct:
          type: number
          description: Share of revenue whose codes have a real cost.
        provisional:
          type: boolean
        message:
          type: string
          nullable: true
      required:
        - byGroup
        - coveragePct
        - provisional
        - message
    AnalyticsReport:
      type: object
      properties:
        fy:
          type: string
        compareFy:
          type: string
        months:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMonthStat"
        compareMonths:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsMonthStat"
        comparableMonths:
          type: array
          items:
            type: string
          description: Month names complete in both fiscal years.
        yoy:
          type: object
          properties:
            overall:
              $ref: "#/components/schemas/AnalyticsYoy"
            territory:
              $ref: "#/components/schemas/AnalyticsYoy"
            institutional:
              $ref: "#/components/schemas/AnalyticsYoy"
          required:
            - overall
            - territory
            - institutional
        invoicesInPeriod:
          type: integer
        customersInPeriod:
          type: integer
        byHead:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsHeadStat"
        compareByHead:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsHeadStat"
        retention:
          $ref: "#/components/schemas/AnalyticsRetention"
        margins:
          $ref: "#/components/schemas/AnalyticsMargins"
      required:
        - fy
        - compareFy
        - months
        - compareMonths
        - comparableMonths
        - yoy
        - invoicesInPeriod
        - customersInPeriod
        - byHead
        - compareByHead
        - retention
        - margins
    MgmtRegion:
      type: object
      properties:
        name:
          type: string
          description: Region name (North, West, South, East).
        states:
          type: array
          items:
            type: string
          description: States that the region expands to.
      required:
        - name
        - states
    MgmtSourceStatus:
      type: object
      properties:
        key:
          type: string
          description: Stable source key.
        name:
          type: string
          description: Human-readable source name.
        status:
          type: string
          enum: [connected, partial, missing]
          description: Whether the source currently feeds the report.
        detail:
          type: string
          description: What is connected or what is needed.
      required:
        - key
        - name
        - status
        - detail
    MgmtOptions:
      type: object
      properties:
        fys:
          type: array
          items:
            type: string
          description: Fiscal years selectable in the report, newest first.
        defaultFy:
          type: string
          description: Fiscal year preselected in the UI.
        regions:
          type: array
          items:
            $ref: "#/components/schemas/MgmtRegion"
        states:
          type: array
          items:
            type: string
          description: All states present in the roster.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MgmtSourceStatus"
      required:
        - fys
        - defaultFy
        - regions
        - states
        - sources
    MgmtReportRequest:
      type: object
      properties:
        fy:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: Fiscal year, e.g. 2026-27.
        regions:
          type: array
          items:
            type: string
          description: Region names to include (expanded to states server-side).
        states:
          type: array
          items:
            type: string
          description: Individual states to include (combined with regions).
        monthFrom:
          type: integer
          minimum: 1
          maximum: 12
          description: First fiscal month included (1 = April).
        monthTo:
          type: integer
          minimum: 1
          maximum: 12
          description: Last fiscal month included (12 = March).
        lowPerfPct:
          type: integer
          minimum: 1
          maximum: 100
          description: Low-performer achievement threshold percent (default 60).
      required:
        - fy
